(() => {
  const base = '/cantrip-cn-study';
  const withBase = value => {
    if (value instanceof URL) value = value.pathname + value.search + value.hash;
    if (typeof value !== "string" || !value.startsWith("/") || value.startsWith("//")) return value;
    if (value === base || value.startsWith(base + "/")) return value;
    return base + (value === "/" ? "/" : value);
  };
  const nativeFetch = window.fetch.bind(window);
  window.fetch = (input, init) => {
    if (typeof input === "string" || input instanceof URL) {
      const url = withBase(input);
      const method = init?.method ?? "GET";
      if (method !== "GET" && new URL(url, location.href).pathname.startsWith(base + "/api/"))
        return Promise.reject(new TypeError("Server APIs are not included in this static snapshot."));
      return nativeFetch(url, init);
    }
    if (input instanceof Request && new URL(input.url).origin === location.origin) {
      const url = withBase(new URL(input.url).pathname + new URL(input.url).search + new URL(input.url).hash);
      if (input.method !== "GET" && new URL(url, location.href).pathname.startsWith(base + "/api/"))
        return Promise.reject(new TypeError("Server APIs are not included in this static snapshot."));
      return nativeFetch(new Request(url, input), init);
    }
    return nativeFetch(input, init);
  };
  for (const method of ["pushState", "replaceState"]) {
    const original = history[method].bind(history);
    history[method] = (state, title, url) => original(state, title, withBase(url));
  }
})();
</script></head><body><template data-detail-tpl="input-16px-line" data-at="10"><div data-part="info"><div class="info" data-astro-cid-axuhkfem><div class="lead" data-astro-cid-axuhkfem><p class="labels" data-astro-cid-axuhkfem><a href="/cantrip-cn-study/?c=principle" data-filter="c:principle" data-astro-cid-axuhkfem>设计原理</a><a href="/cantrip-cn-study/?t=click" data-filter="t:click" data-astro-cid-axuhkfem>点击</a><a href="/cantrip-cn-study/?t=type" data-filter="t:type" data-astro-cid-axuhkfem>输入</a></p><h2 id="detail-title" data-astro-cid-axuhkfem>16px 这条线</h2><p class="desc" data-astro-cid-axuhkfem>Adheeb 把一条老规矩摆成两台手机：左边输入框 14px，一点就被 iPhone 推近；右边 16px，纹丝不动。</p><p class="byline" data-astro-cid-axuhkfem><a href="https://x.com/AdheebHameed/status/2120153542094962869" target="_blank" rel="noreferrer" data-astro-cid-axuhkfem>作者：Adheeb<svg width="1em" height="1em" viewBox="0 0 256 256" data-astro-cid-axuhkfem="true" data-icon="ph:arrow-up-right-bold"><path fill="currentColor" d="M204 64v104a12 12 0 0 1-24 0V93L72.49 200.49a12 12 0 0 1-17-17L163 76H88a12 12 0 0 1 0-24h104a12 12 0 0 1 12 12"/></svg></a><span class="sep" aria-hidden="true" data-astro-cid-axuhkfem>·</span><time datetime="2026-11-14" data-astro-cid-axuhkfem>2026 年 11 月 14 日</time></p></div><div class="side" data-astro-cid-axuhkfem><div class="actions single" data-astro-cid-axuhkfem><button class="btn primary t-press" type="button" data-copy-prompt="帮我把「16px 这条线」这条做界面的规矩用到我的项目里。

规矩：iPhone 上的 Safari 遇到字号小于 16px 的输入框，一点进去就把整页放大，用户得自己缩回去，填表时反复找自己填到了哪。
去哪找：所有 input、textarea、select，以及组件库里的输入类组件（搜索框、验证码框、聊天输入框）；留意 14px、0.875rem、text-sm 这类字号，和被父元素或 transform 缩小过的。
怎么改：在手机尺寸下，让这些控件里输入的文字至少 16px（根字号是 16px 时就是 1rem）；桌面端可以保留原来的字号。标签和说明文字可以小，输入的字不行。
别这样做：不要在 viewport 里加 maximum-scale=1 或 user-scalable=no 来挡，这会妨碍需要放大页面的人。
怎么验：在 iPhone 或 iOS 模拟器里点进每个输入框，页面不应被推近。

先在我的代码里找出所有适用的地方，列出要改哪些、打算怎么改，等我确认再动手；改完告诉我怎么验证。

<p>两边除了字号完全一样：同一张「Welcome back」登录页，同一个蓝色「Log in」按钮，同一串 <a href="mailto:sam.carter@mail.com">sam.carter@mail.com</a>。点进邮箱框的那一刻，左边 14px 那台整页被顶上来，标题和图标被挤出屏幕，剩下一个放大的输入框；右边 16px 那台一动不动。</p>
<p>一次放大看着不算什么，但登录页有邮箱和密码两个框，每点一次推一次。说到底不是字号好不好看的问题，是别让人在填表时反复找自己填到了哪。</p>
