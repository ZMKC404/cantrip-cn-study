<li>把手随着速度变细、拉长并向运动的反方向弯曲，给拖动添了一点阻力感；停下后恢复成短胶囊，提示这里仍能继续调整。</li>
<li>到达宽度限制后只剩很小的弹性位移，松手便回到边界，既能感到限制，也不会出现突然卡死的手感。</li>
<li>接管演示时保留当前面板宽度，第一下拖动就作用在眼前的位置；键盘也可以逐步调整。</li>
</ul>
