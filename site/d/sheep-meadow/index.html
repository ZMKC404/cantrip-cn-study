<p>点一只羊，旁边会弹出一个很「专业」的标签，写着「2.12 × 1.69 m · 60 m away」，下面是一排动作：Idle、Graze、Walk、Jump，还有撤销、重做、复制和删除。给一只玩具羊配上 3D 编辑器那一套正经工具，反差本身就很好笑。</p>
<p>整块草地像一张摆在纸上的水彩画，边缘羽化进米白底，河、土路和田块看起来都像手绘。不去点它们，羊也会自己在草上慢慢走动，放着看也行。</p>
