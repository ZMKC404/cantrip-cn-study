<li>每张卡的插画只做一件和标题有关的小事，点到为止：产品界面的窗口错开，图标被构造线重新画出，插画的曲线重描一遍，设计系统的色板排成一行。</li>
<li>一次只亮一张卡。卡片悬停或聚焦时上浮一点，位移用带轻微过冲的曲线，描线用平稳收尾的曲线。</li>
<li>构造线和缎带都用 <code>pathLength=1</code> 归一化，描边偏移从 1 走到 0 就是画完，长短不同的线共用一套时间。</li>
</ul>
