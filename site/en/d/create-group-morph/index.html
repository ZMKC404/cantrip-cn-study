<p>Each step carries the last one’s result along. The faces you pick fly up into the header and are still there on the naming page; the number on “Next” follows how many people you have picked; as you type the name, the initials in the avatar follow (Design team becomes DT), and change color when you do. You never have to remember what you just chose; it stays in front of you.</p>
<p>It is the same thinking as the <a href="/cantrip-cn-study/en/i/dynamic-island">Dynamic Island</a>: the small thing and the big thing are two sizes of one object, so you can see where it grew from and where it went back to. The component can be tried live on Youssef’s Bluma; the code comes with a paid plan.</p>
