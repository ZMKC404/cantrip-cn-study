r content and icons are redrawn as neutral vectors.</p>
<p>Drag a file and hold Shift, and the formats arrange themselves in sectors around it. The direction you choose and the orange-red highlight move together, and the text in the center confirms the current target. Release and a new file appears on the desktop, the original staying where it was, so the result and its source sit side by side.</p>
<p>The image’s action ring carries on with the same direction-based choosing, and Crop Image and Add BG lead into warm translucent panels. This version supports those two edits and format switching; the other actions keep the sector previews from the original film, with no connection to system files or a real conversion service.</p>
<p>When cropping, a dark mask marks what’s being cut away, the frame can be moved from inside and resized from the four corners, and switching to 1:1 constrains the shape at once. In the background panel, padding, corner radius, shadow and ratio update the preview directly, and after saving, the desktop thumbnail keeps the final settings.</p>
<p>Dragging has no delay, and opening and closing use only short easing. When you take over from the autoplay, the demo’s gestures stop, and the current panel and settings stay usable. Touch can drag or tap directly, and the keyboard can choose sectors and adjust the crop.</p>
