><button class="btn t-press" type="button" data-copy-code="/code/password-eye" data-gate="code" data-astro-cid-axuhkfem><svg width="1em" height="1em" viewBox="0 0 256 256" data-astro-cid-axuhkfem="true" data-icon="ph:code-bold"><path fill="currentColor" d="M71.68 97.22L34.74 128l36.94 30.78a12 12 0 1 1-15.36 18.44l-48-40a12 12 0 0 1 0-18.44l48-40a12 12 0 0 1 15.36 18.44m176 21.56l-48-40a12 12 0 1 0-15.36 18.44L221.26 128l-36.94 30.78a12 12 0 1 0 15.36 18.44l48-40a12 12 0 0 0 0-18.44M164.1 28.72a12 12 0 0 0-15.38 7.18l-64 176a12 12 0 0 0 7.18 15.37a11.8 11.8 0 0 0 4.1.73a12 12 0 0 0 11.28-7.9l64-176a12 12 0 0 0-7.18-15.38"/></svg>Copy code</button><a class="btn t-press" href="/cantrip-cn-study/code/password-eye" download="password-eye.html" data-gate="code" data-astro-cid-axuhkfem><svg width="1em" height="1em" viewBox="0 0 256 256" data-astro-cid-axuhkfem="true" data-icon="ph:download-simple-bold"><path fill="currentColor" d="M228 144v64a12 12 0 0 1-12 12H40a12 12 0 0 1-12-12v-64a12 12 0 0 1 24 0v52h152v-52a12 12 0 0 1 24 0m-108.49 8.49a12 12 0 0 0 17 0l40-40a12 12 0 0 0-17-17L140 115V32a12 12 0 0 0-24 0v83L96.49 95.51a12 12 0 0 0-17 17Z"/></svg>Download HTML</a></div></div><dl class="meta" data-astro-cid-axuhkfem><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>Style</dt><dd data-astro-cid-axuhkfem>Playful, Bold</dd></div><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>Tone</dt><dd data-astro-cid-axuhkfem>Dark</dd></div><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>Built with</dt><dd data-astro-cid-axuhkfem>JavaScript, CSS, SVG</dd></div></dl></div><section class="notes" data-astro-cid-axuhkfem><h3 data-astro-cid-axuhkfem>Design notes</h3><div data-astro-cid-axuhkfem><ul>
<li>Showing a password is usually all or nothing. As a searchlight, it reveals only the characters the light falls on, one stretch at a time, so you light up the part you want to check.</li>
<li>The beam’s direction hangs on a spring (<code>k = 40</code>, damping ratio <code>0.7</code>) instead of pointing straight at the pointer. It turns a beat late and overshoots slightly when it stops, like someone turning a lamp.</li>
<li>Leave the pointer still for a moment and the eye starts scanning around on its own, as if looking for someone. Move your hand and the light chases the pointer again.</li>
<li>The test uses angles, not rectangle overlap: with the eye as the origin, it computes each character’s bearing, and a character shows once that bearing falls within the beam’s <code>12°</code> half-angle. The edge fades over <code>2°</code>, so the line between light and dark moves smoothly with the beam.</li>
<li>The real input only handles typing and the caret, with transparent text. A monospaced layer of per-character spans sits on top to show dots or plain text, so the caret and characters always line up.</li>
</ul>
