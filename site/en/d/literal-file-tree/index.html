        return Promise.reject(new TypeError("Server APIs are not included in this static snapshot."));

<p>When you enter a folder, the view travels along the branch and a new branch grows from that spot. The moss on the branches is drawn with green pixels, which stands out against the white window. The item count in the bottom bar changes with where you are.</p>
