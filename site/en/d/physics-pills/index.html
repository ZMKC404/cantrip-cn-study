<li>Stacked, it doesn’t jitter; pinched, it hangs; thrown, it flies. It’s a small rigid-body solver written from scratch, and bounce is only added when the impact is fast enough.</li>
<li>Grabbing is a soft joint attached at the point you pressed: lift a pill by one end and it hangs and swings. On release, the pointer’s last speed is mixed in, so a flick really throws it.</li>
<li>In fast motion, a few semi-transparent copies are layered along the path to make motion blur, and the overlaps build back up to solid.</li>
<li>The two piles behind aren’t interactive. They’re scaled down, raised a little, blurred as whole layers and faded to make depth. The middle pile has its own physics and doesn’t collide with the front one. The starting pile is computed offline, the solver stops once everything is still, and a touch wakes it up.</li>
<li>On touch screens, a vertical swipe starting on empty space still scrolls the page; only pressing on a pill picks it up.</li>
</ul>
