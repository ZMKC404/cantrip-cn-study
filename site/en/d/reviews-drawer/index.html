<li>Every frame follows the scroll position: the whole picture is a function of one continuous position <code>p</code>, where <code>0</code> is the drawer closed and <code>k</code> is the k-th folder open. A critically damped spring follows it, so it has weight but doesn’t wobble.</li>
<li>Changing to the next testimonial happens in three staggered stages: the old testimonial sinks back first, the old folder moves up and fades, then the new folder lifts and its testimonial slides out, overshooting slightly at the end before it settles.</li>
<li>When you stop, it snaps to a whole notch in the direction of your last scroll: one mouse-wheel click turns to the next testimonial, and small trackpad jitters get pulled back.</li>
<li>The text appears letter by letter only after the testimonial has fully slid out; on the way back it all fades together, so it doesn’t drag behind the scroll.</li>
</ul>
