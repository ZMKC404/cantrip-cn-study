<li>The pill doesn’t slide over; it grows out of the dot of the selected day. Each day keeps a dark pill inside its cell, and at rest <code>clip-path</code> shrinks it to a point at the dot’s center.</li>
<li>Opening overshoots the cell a little and settles; closing is shorter, on an accelerating curve, as if the dot sucked it back. The color of the date number follows the edge of the pill.</li>
<li>The bill card hides under the calendar card: on a day with a bill it drops in on a spring, otherwise it retracts, and the whole group re-centers at the same time so the visual center doesn’t wander.</li>
<li>Arrow keys move between days within the week, and Home/End jump to Monday and Sunday.</li>
</ul>
