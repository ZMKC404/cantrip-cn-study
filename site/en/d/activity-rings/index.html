<li>The sense of the ring lapping over its own start comes from the cap’s shadow: the end cap is drawn a second time, and its shadow falls only on the start it covers, so it never dirties the arc behind it.</li>
<li>Past 100%, the first lap stays a full ring and a second arc runs again from the top. The moment it crosses 100%, the cap sends out a halo in the same color.</li>
<li>The three rings share one spring, <code>1.1s / bounce 0.2</code>, staggered by <code>70ms</code>. When you switch, the spring retargets from its current velocity, so the rings never stop and start again.</li>
<li>All numbers use <code>tabular-nums</code>, so the width holds while they count. When a goal is met, its target value turns the ring’s color.</li>
</ul>
