<li>The wireframe and the final screen are one DOM with two skins: the wireframe layer only swaps colors, outlines and placeholders, and the geometry doesn’t move at all, so both sides of the divider always line up. The orange handwritten notes are drawn only on the wireframe layer and are revealed along with it.</li>
<li>The top layer is cut with <code>clip-path: inset()</code> and the divider moves with <code>translate3d</code>, so the whole drag touches only compositor properties. You can drag by grabbing the handle or by pressing anywhere in the window.</li>
<li>At rest the divider sits at <code>42%</code>: mostly the final screen, with a strip of wireframe and two notes showing on the left. Dragged past the edge, only the handle follows a little, with damping, and springs back to the edge when you let go.</li>
<li>The “Wireframe / Final” corner tags fade with the position: whichever side is about to be squeezed out loses its label first.</li>
</ul>
