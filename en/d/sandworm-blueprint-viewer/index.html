could still tell it was the worm.</p>
<p>The rings along its body became armored segments, “SEGMENTED TORSO RINGS”. The round mouth that swallows sand became a rotary drill, “ROTARY DRILL ASSEMBLY”, with 32 sand-pushing blades around its rim, “DISPLACEMENT BLADES”. The way it heaves itself through the sand became the drive system, “PERISTALTIC LINEAR DRIVE”, and its “LOCOMOTION CYCLE” is drawn along the bottom. Every part maps onto a feature of the worm in the films, so the machine looks alien, yet every part has a reason for its shape.</p>
<p>Its identity changed too. The god the Fremen hold in awe is here an unmanned excavator numbered “SANDWORM MK-X”: the crew line reads “NONE (AUTONOMOUS)”, and its power is “FUSION / THERMOELECTRIC”. The fun is in how straight-faced it is: a god, written up as a piece of equipment.</p>
<p>The engineering drawings, the six views and the X-ray are all there to make the machine feel real: specs and cutaways around the edges, the middle left to the worm; turn on the X-ray and you can see a long stretch of it still buried under the sand.</p>
