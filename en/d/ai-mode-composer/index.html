<li>The mode button grows into the menu itself, and the selected item stays at the bottom. When it folds back, the label lands where the original pill was, so your eyes don’t have to look for the control again.</li>
<li>The model list opens upward and leaves the space under the message box for the upgrade strip. Reasoning effort appears at the side, so you never leave the model choice to open a separate settings page.</li>
<li>As you type a search, the list height shrinks with the number of results, and its bottom edge always lines up with the button that opened it. However few results there are, the control doesn’t drift away.</li>
<li>The plus and record buttons only add their text on hover, which keeps the bar compact at rest. They fold back as soon as you move away, lightly and without overshoot.</li>
<li>Visitors can choose a mode, a model and an effort level, filter models, add local file names and type a message. When you take over from the autoplay, the open menu and the search text stay as they are, so your first action applies to what’s already on screen.</li>
</ul>
