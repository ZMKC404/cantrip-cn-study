<p>The project list on the home page is built for choosing, too: wherever the pointer rests, that row turns orange-red and the others fade together, leaving the eye one choice. The bio says what the author is working on now, and earlier experience is set in a lighter color, so the reader naturally sees the present first.</p>
<p>The case study is about the interface Sue Park designed for AlphaGrill, a griddle-and-grill robot for commercial kitchens. As you read down, the contents on the left light up the current section; when you finish, the page runs straight on into the next project.</p>
<p>I came across this one when nanda shared it, with special praise for the page transition.</p>
