(() => {
  const base = '/cantrip-cn-study';
  const withBase = value => {
    if (value instanceof URL) value = value.pathname + value.search + value.hash;
    if (typeof value !== "string" || !value.startsWith("/") || value.startsWith("//")) return value;
    if (value === base || value.startsWith(base + "/")) return value;
    return base + (value === "/" ? "/" : value);
  };
  const nativeFetch = window.fetch.bind(window);
  window.fetch = (input, init) => {
    if (typeof input === "string" || input instanceof URL) {
      const url = withBase(input);
      const method = init?.method ?? "GET";
      if (method !== "GET" && new URL(url, location.href).pathname.startsWith(base + "/api/"))
        return Promise.reject(new TypeError("Server APIs are not included in this static snapshot."));
      return nativeFetch(url, init);
    }
    if (input instanceof Request && new URL(input.url).origin === location.origin) {
      const url = withBase(new URL(input.url).pathname + new URL(input.url).search + new URL(input.url).hash);
      if (input.method !== "GET" && new URL(url, location.href).pathname.startsWith(base + "/api/"))
        return Promise.reject(new TypeError("Server APIs are not included in this static snapshot."));
      return nativeFetch(new Request(url, input), init);
    }
    return nativeFetch(input, init);
  };
  for (const method of ["pushState", "replaceState"]) {
    const original = history[method].bind(history);
    history[method] = (state, title, url) => original(state, title, withBase(url));
  }
})();
</script></head><body><template data-detail-tpl="submenu-safe-triangle" data-at="16"><div data-part="info"><div class="info" data-astro-cid-axuhkfem><div class="lead" data-astro-cid-axuhkfem><p class="labels" data-astro-cid-axuhkfem><a href="/cantrip-cn-study/en?c=principle" data-filter="c:principle" data-astro-cid-axuhkfem>Design Principles</a><a href="/cantrip-cn-study/en?t=hover" data-filter="t:hover" data-astro-cid-axuhkfem>Hover</a></p><h2 id="detail-title" data-astro-cid-axuhkfem>Submenu Safe Triangle</h2><p class="desc" data-astro-cid-axuhkfem>Akash shows an old pattern as a before-and-after, top and bottom. Slide diagonally to the submenu and the items you cross no longer steal it. Done right, nobody notices.</p><p class="byline" data-astro-cid-axuhkfem><a href="https://x.com/a1x45h/status/2115805964725367180" target="_blank" rel="noreferrer" data-astro-cid-axuhkfem>By Akash<svg width="1em" height="1em" viewBox="0 0 256 256" data-astro-cid-axuhkfem="true" data-icon="ph:arrow-up-right-bold"><path fill="currentColor" d="M204 64v104a12 12 0 0 1-24 0V93L72.49 200.49a12 12 0 0 1-17-17L163 76H88a12 12 0 0 1 0-24h104a12 12 0 0 1 12 12"/></svg></a><span class="sep" aria-hidden="true" data-astro-cid-axuhkfem>·</span><time datetime="2026-11-06" data-astro-cid-axuhkfem>Nov 6, 2026</time></p></div><div class="side" data-astro-cid-axuhkfem><div class="actions single" data-astro-cid-axuhkfem><button class="btn primary t-press" type="button" data-copy-prompt="Help me apply &quot;Submenu Safe Triangle&quot;, a rule for building interfaces, to my project.

The rule: moving the mouse diagonally from a menu item to its submenu, the path brushes past the items below; without protection, each one it crosses swaps in its own submenu. Leave an invisible triangular safe area between the pointer and the submenu.
Where to look: everywhere a submenu opens on hover: dropdown menus, context menus, multi-level nav, mega menus. First check whether the menu library already has it (Radix's submenus do, for example); if so, there's nothing to build.
What to change: when the pointer leaves the parent item, note that point and join it to the top and bottom corners of the submenu's near edge to make a triangle; while the pointer moves inside it, ignore the items it crosses and don't switch submenus; only if the pointer comes to rest for a moment (about 100–300ms) without reaching the submenu does switching resume. For a submenu that opens to the left, flip the triangle.
Don't: just put a fixed delay on switching; that makes ordinary up-and-down movement sluggish too.
How to check: from an item with a submenu, move diagonally to the submenu's farthest entry, brushing past other items; the submenu shouldn't change. Moving up and down the menu normally shouldn't feel any slower.

First find every place in my code it applies to, and list what you would change and how. Wait for my go-ahead before editing; when you're done, tell me how to check it.

Source: Akash's explainer, https://x.com/a1x45h/status/2115805964725367180
See it here: https://cantrip.cn/en/i/submenu-safe-triangle

<p>The fix is an invisible triangle drawn from where the pointer left the item to the submenu’s top and bottom corners. While the pointer is inside the triangle, the menu ignores the other items; stop for a moment and it switches as usual. The demo tints that area pale blue and shows the two approaches one above the other.</p>
<p>The pattern isn’t new: Amazon’s category menu and macOS menus handle it in a similar way. Done right, nobody notices; left out, the menu just feels like it isn’t listening.</p>
