(() => {
  const base = '/cantrip-cn-study';
  const withBase = value => {
    if (value instanceof URL) value = value.pathname + value.search + value.hash;
    if (typeof value !== "string" || !value.startsWith("/") || value.startsWith("//")) return value;
    if (value === base || value.startsWith(base + "/")) return value;
    return base + (value === "/" ? "/" : value);
  };
  const nativeFetch = window.fetch.bind(window);
  window.fetch = (input, init) => {
    if (typeof input === "string" || input instanceof URL) {
      const url = withBase(input);
      const method = init?.method ?? "GET";
      if (method !== "GET" && new URL(url, location.href).pathname.startsWith(base + "/api/"))
        return Promise.reject(new TypeError("Server APIs are not included in this static snapshot."));
      return nativeFetch(url, init);
    }
    if (input instanceof Request && new URL(input.url).origin === location.origin) {
      const url = withBase(new URL(input.url).pathname + new URL(input.url).search + new URL(input.url).hash);
      if (input.method !== "GET" && new URL(url, location.href).pathname.startsWith(base + "/api/"))
        return Promise.reject(new TypeError("Server APIs are not included in this static snapshot."));
      return nativeFetch(new Request(url, input), init);
    }
    return nativeFetch(input, init);
  };
  for (const method of ["pushState", "replaceState"]) {
    const original = history[method].bind(history);
    history[method] = (state, title, url) => original(state, title, withBase(url));
  }
})();
</script></head><body><template data-detail-tpl="overflowing-tabs" data-at="3"><div data-part="info"><div class="info" data-astro-cid-axuhkfem><div class="lead" data-astro-cid-axuhkfem><p class="labels" data-astro-cid-axuhkfem><a href="/cantrip-cn-study/en?c=principle" data-filter="c:principle" data-astro-cid-axuhkfem>Design Principles</a><a href="/cantrip-cn-study/en?t=scroll" data-filter="t:scroll" data-astro-cid-axuhkfem>Scroll</a><a href="/cantrip-cn-study/en?t=swipe" data-filter="t:swipe" data-astro-cid-axuhkfem>Swipe</a><a href="/cantrip-cn-study/en?t=click" data-filter="t:click" data-astro-cid-axuhkfem>Click</a><a href="/cantrip-cn-study/en?t=keyboard" data-filter="t:keyboard" data-astro-cid-axuhkfem>Keyboard</a></p><h2 id="detail-title" data-astro-cid-axuhkfem>Overflowing Tabs</h2><p class="desc" data-astro-cid-axuhkfem>Haz, who wrote Ariakit, takes apart an old problem: more tabs than fit in a row. Mouse users, touch users and keyboard users get stuck in different places, and one tab bar has to look after all three.</p><p class="byline" data-astro-cid-axuhkfem><a href="https://x.com/diegohaz/status/2122396486835020227" target="_blank" rel="noreferrer" data-astro-cid-axuhkfem>By Haz<svg width="1em" height="1em" viewBox="0 0 256 256" data-astro-cid-axuhkfem="true" data-icon="ph:arrow-up-right-bold"><path fill="currentColor" d="M204 64v104a12 12 0 0 1-24 0V93L72.49 200.49a12 12 0 0 1-17-17L163 76H88a12 12 0 0 1 0-24h104a12 12 0 0 1 12 12"/></svg></a><span class="sep" aria-hidden="true" data-astro-cid-axuhkfem>·</span><time datetime="2026-11-17" data-astro-cid-axuhkfem>Nov 17, 2026</time></p></div><div class="side" data-astro-cid-axuhkfem><div class="actions single" data-astro-cid-axuhkfem><button class="btn primary t-press" type="button" data-copy-prompt="Help me apply &quot;Overflowing Tabs&quot;, a rule for building interfaces, to my project.

The rule: when tabs don't fit in one row, the same tab bar has to work for three kinds of people: mouse users (hide the scrollbar and they can't tell how to scroll), touch users (if nothing shows there's more, they won't swipe) and keyboard users (the focused tab ends up hidden under an arrow or a fade).
Where to look: every horizontal list that can overflow: tab bars, filter chips, segmented controls, horizontal nav, especially any with overflow-x: auto and a hidden scrollbar.
What to change: fade the edges with mask-image, only on a side that still has content to reveal, not on a side scrolled to its end (fades alone can be pure CSS with scroll-driven animations; once there are arrows too, let the fades and the arrows share one check of which side has more). On desktop, show arrow buttons on the sides with more content, each click scrolling by a step; at the end, dim and disable the arrow and hide it only once the pointer leaves, so its disappearing doesn't make the next click land on a tab beneath. Keep the arrow buttons out of the Tab order, and give the scroll container scroll-padding-inline at least as wide as an arrow plus the fade, so a focused tab comes fully into view.
Don't: just hide the scrollbar and stop there, or make an arrow vanish the moment it reaches the end.
How to check: with a mouse alone (no trackpad) you can reach the last tab; on a phone it's obvious the row swipes; after reaching the end, clicking repeatedly where the arrow was hits no tab; tabbing from the first tab, every focused tab is fully visible.

First find every place in my code it applies to, and list what you would change and how. Wait for my go-ahead before editing; when you're done, tell me how to check it.

cn-study/en/i/progressive-blur-feed">Progressive Blur Feed</a> I collected earlier: an edge that softens instead of cutting off tells you the content carries on past it. The filter bar at the top of this site on desktop works the same way, and I made a whole video about progressive blur.</p>
<p>Arrow buttons on desktop bring a new problem: reach the end, the arrow disappears, a tab slides in under the pointer, and someone still clicking at the same rhythm hits the wrong thing. So at the end the arrow stays, dimmed and inert, and goes away only once the pointer leaves. The keyboard is the same story: tabbing along, the focused tab has to come fully into view, not stop beneath an arrow or a faded edge.</p>
<p>Each of these is small on its own; together they say one thing. The same control is three different things to a mouse, a finger and a keyboard, and building for only one of them leaves the other two stuck. Haz notes that nearly all of it can be done in CSS (masks, scroll-driven animations, scroll-padding), with a little JS only for the scrolling itself.</p>
