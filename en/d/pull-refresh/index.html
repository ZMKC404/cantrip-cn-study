<li>The harder you pull, the heavier it gets: the movement is damped logarithmically. It follows your finger almost 1:1 at first, then each pixel buys less movement, so it always moves but never goes far.</li>
<li>The gap reads as “there’s another layer below,” not a blank space: pulling it open reveals a cooler gray underneath, and the top edge of the list casts a shadow upward, so the indicator seems to peek out from under the list.</li>
<li>Crossing the <code>96px</code> threshold closes the ring, flips the arrow and gives the button a light bounce, a silent “click.”</li>
<li>When the refresh finishes, it says “1 new post” before closing; the new item unfolds and drops in, and a light blue background lingers, then fades, so what arrived is visible at a glance.</li>
</ul>
