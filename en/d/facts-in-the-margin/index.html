    if (value === base || value.startsWith(base + "/")) return value;

  const nativeFetch = window.fetch.bind(window);

        return Promise.reject(new TypeError("Server APIs are not included in this static snapshot."));
      return nativeFetch(new Request(url, input), init);
    }

f cut differently: as shortening starts, filler turns grey and facts get an orange underline, so you first see how the AI sorted them.</p>
<p>Then the filler simply disappears, but the facts do not: they fly into the margin and line up under “Facts removed”. If one should stay, a click sends it flying back into its sentence. The word count sits in the corner the whole time (56 → 30 words) and grows a little with each fact you restore, so you weigh how much to cut yourself, then choose Accept or Discard, and even after accepting you can Undo.</p>
<p>It is the same idea as the <a href="/cantrip-cn-study/en/i/subagent-task-fanout">Subagent Task Fanout</a>: put what the AI does behind the scenes on the table, and people can trust it. This is a design exploration Yanis built with Motion, not a feature from any shipping product.</p>
