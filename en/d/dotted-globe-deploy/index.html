<li>
<p>Hovering over the region list previews the city right away, and the dotted globe follows with a little inertia. The city name, the region code and the blue marker line up, so each option is no longer just a code to memorize.</p>
</li>
<li>
<p>The list, the deploy checklist and the result summary all unfold around the same globe window. The card stays centered as its height changes, and the globe moves along with the title, so the layout stays easy to follow as the state changes.</p>
</li>
<li>
<p>Green checks build up downward, the active row is marked with a pale grey background and a small ring, and at the end route lines spread out from the city. While you wait, you can tell which step it’s on.</p>
</li>
<li>
<p>An error stays on the failing test row first, then folds into a pink error detail, with copy and retry right beside the log. When copying succeeds, the button text itself changes, so there’s no extra notice to deal with.</p>
</li>
<li>
<p>When you take over from the autoplay, the current city, the camera’s inertia and the deploy progress are kept. Regions can be chosen from the keyboard, and retrying runs through the successful flow. Every deploy is a local demo and sends no requests to a real service.</p>
</li>
</ul>
