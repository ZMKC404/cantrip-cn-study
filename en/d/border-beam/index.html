<li>When progress is unknown, it doesn’t draw a percentage: a beam of light circles the border at a steady pace and says only “still running”.</li>
<li>How it ends means something. On completion the head runs the rest of the perimeter and closes the ring, the whole ring flares, then dims. On stop it doesn’t close; it goes straight dark, and the text already written drops to half opacity and stays.</li>
<li>The beam is one dashed segment on a rounded-rectangle path, moving at a strictly constant speed along the perimeter with no speeding up at corners. The path sits right on the card’s edge, so it reads as light inside the border, not decoration stuck on.</li>
<li>The beam is a stack of glow, bloom, halo and a few core lines, bright at the head and faint at the tail. The stroke is a diagonal gradient, so the color shifts wherever the light goes.</li>
</ul>
