<li>You see where it will land before you let go: while you drag, the other cards and the dashed slot below all make room with the same set of springs, using <code>transform</code>. The DOM order only changes on drop.</li>
<li>Lifting is three things: a little larger, a little tilted, and a separate large shadow layer. The card pivots on the point you grabbed and swings with vertical speed, then hangs straight again when your hand stops.</li>
<li>Past the first or last position, it gets iOS-style rubber-band damping. The landing spring inherits your release speed and dips before returning to full size: set down, not released.</li>
<li>The keyboard can reorder too, and each step reads out the position through <code>aria-live</code>.</li>
</ul>
