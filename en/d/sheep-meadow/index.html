<p>Click a sheep and a very serious label pops up beside it, reading “2.12 × 1.69 m · 60 m away”, with a row of actions below: Idle, Graze, Walk, Jump, plus undo, redo, duplicate and delete. Giving a toy sheep the full kit of a 3D editor is a joke in itself.</p>
<p>The whole meadow looks like a watercolour laid on paper, its edges feathered into the off-white page, the stream, road and fields all looking hand-painted. Left alone, the sheep still amble about the grass, so it works just as well as something to watch.</p>
