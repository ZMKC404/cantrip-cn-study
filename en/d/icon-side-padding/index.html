</script></head><body><template data-detail-tpl="icon-side-padding" data-at="0"><div data-part="info"><div class="info" data-astro-cid-axuhkfem><div class="lead" data-astro-cid-axuhkfem><p class="labels" data-astro-cid-axuhkfem><a href="/cantrip-cn-study/en?c=principle" data-filter="c:principle" data-astro-cid-axuhkfem>Design Principles</a><a href="/cantrip-cn-study/en?t=auto" data-filter="t:auto" data-astro-cid-axuhkfem>Autoplay</a></p><h2 id="detail-title" data-astro-cid-axuhkfem>Icon-Side Padding</h2><p class="desc" data-astro-cid-axuhkfem>A button tip from Michael: an icon needs less room beside it than text does. An icon carries its own ring of blank space, so padding that measures equal looks wider on the icon side.</p><p class="byline" data-astro-cid-axuhkfem><a href="https://x.com/MichaelFilipiuk/status/2122314262064546248" target="_blank" rel="noreferrer" data-astro-cid-axuhkfem>By Michael Filipiuk<svg width="1em" height="1em" viewBox="0 0 256 256" data-astro-cid-axuhkfem="true" data-icon="ph:arrow-up-right-bold"><path fill="currentColor" d="M204 64v104a12 12 0 0 1-24 0V93L72.49 200.49a12 12 0 0 1-17-17L163 76H88a12 12 0 0 1 0-24h104a12 12 0 0 1 12 12"/></svg></a><span class="sep" aria-hidden="true" data-astro-cid-axuhkfem>·</span><time datetime="2026-11-17" data-astro-cid-axuhkfem>Nov 17, 2026</time></p></div><div class="side" data-astro-cid-axuhkfem><div class="actions single" data-astro-cid-axuhkfem><button class="btn primary t-press" type="button" data-copy-prompt="Help me apply &quot;Icon-Side Padding&quot;, a rule for building interfaces, to my project.

The rule: when a button has an icon, the padding on the icon's side should be smaller than on the text's side. An icon carries its own ring of blank space, so equal numbers look wider on the icon side.
Where to look: every icon-plus-label button, icon before or after the label, including every variant of the button component, link buttons and dropdown buttons with a chevron. Text-only and icon-only buttons stay as they are.
What to change: keep the text-side padding and trim only the icon side; about 4px less than the text side is a common starting point (16px → 12px, say), rounded to the project's spacing scale. Make the icon a touch smaller than the text, tighten the gap between icon and label a little, and nudge irregular icons such as a play triangle or a chevron by about 1px until they look right.
Don't: trim both sides, or fix buttons one by one; change the button component so every icon button gets it.
How to check: put a button with an icon next to one without; the space on the icon side and the text side should look the same.

First find every place in my code it applies to, and list what you would change and how. Wait for my go-ahead before editing; when you're done, tell me how to check it.

Source: Michael Filipiuk's explainer, https://x.com/MichaelFilipiuk/status/2122314262064546248

<p>Michael’s point is to take that extra back: less padding on the icon side, whether the icon comes before the label or after it. A play triangle or a dropdown chevron, with its irregular shape, often looks off when it is centered by measurement, for the same reason. It comes down to one line: divide space by what the eye sees, not by the numbers.</p>
<p>Plenty of buttons feel a little loose or a little off without anyone being able to say why, and those few pixels are often the reason. After this one, you look at the icon side of your own buttons first.</p>
