<p>The three dots under the chest are upgrade chances, and the screen says “1 chance left!”. You can count what’s left at a glance, and when they’re used up it says “Tap to open!”.</p>
<p>At the moment of opening, the card turns from its back to its front and lands as a red card that spells out the reward, with “CONTINUE” below it. The reward is hidden first and only appears when the card turns over, and that step is what makes it feel like a ceremony.</p>
