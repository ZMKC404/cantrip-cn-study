<p>首页的项目列表也是为挑选准备的：鼠标停在哪一行，那一行变成橙红色，其余几行一起变淡，眼睛只剩一个选择。简介里写着作者现在做的事，更早的经历字色更浅，读的人自然先看到现在。</p>
<p>案例页讲的是 Sue Park 给商用厨房的煎烤机器人 AlphaGrill 做的界面。往下读时，左边的目录跟着亮到当前这一节；读完，页底直接接着下一个项目。</p>
