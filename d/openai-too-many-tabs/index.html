<p>然后所有线头散掉，画面只剩一个词「connected.」，OpenAI 这才出场。接下来三段各拿一个结果说话：一句「Design typography posters that stop scrolling.」变出一圈海报，报错的那行代码自己修好，零散的数字长成一棵写着「MONTHLY REPORT」的开花树枝。每段只给结果，不讲功能。</p>
<p>结尾「One place to」后面换着「Imagine」「Build」「Discover.」，和开头「too many」后面换词是同一个手法，一头一尾，从太多收成一处。这是 Anmol 自己做的概念片，但一支发布片该有的结构都在：先说痛，再给转折，拿结果证明，最后一句话收住。</p>
