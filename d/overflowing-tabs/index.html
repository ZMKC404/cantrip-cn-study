<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="robots" content="noindex"><link rel="stylesheet" href="/cantrip-cn-study/_astro/feed.i3oLm75g.css"><link rel="stylesheet" href="/cantrip-cn-study/_astro/DetailBody.CIetCpo6.css"><script>
(() => {
  const base = '/cantrip-cn-study';
  const withBase = value => {
    if (value instanceof URL) value = value.pathname + value.search + value.hash;
    if (typeof value !== "string" || !value.startsWith("/") || value.startsWith("//")) return value;
    if (value === base || value.startsWith(base + "/")) return value;
    return base + (value === "/" ? "/" : value);
  };
  const nativeFetch = window.fetch.bind(window);
  window.fetch = (input, init) => {
    if (typeof input === "string" || input instanceof URL) {
      const url = withBase(input);
      const method = init?.method ?? "GET";
      if (method !== "GET" && new URL(url, location.href).pathname.startsWith(base + "/api/"))
        return Promise.reject(new TypeError("Server APIs are not included in this static snapshot."));
      return nativeFetch(url, init);
    }
    if (input instanceof Request && new URL(input.url).origin === location.origin) {
      const url = withBase(new URL(input.url).pathname + new URL(input.url).search + new URL(input.url).hash);
      if (input.method !== "GET" && new URL(url, location.href).pathname.startsWith(base + "/api/"))
        return Promise.reject(new TypeError("Server APIs are not included in this static snapshot."));
      return nativeFetch(new Request(url, input), init);
    }
    return nativeFetch(input, init);
  };
  for (const method of ["pushState", "replaceState"]) {
    const original = history[method].bind(history);
    history[method] = (state, title, url) => original(state, title, withBase(url));
  }
})();
</script></head><body><template data-detail-tpl="overflowing-tabs" data-at="3"><div data-part="info"><div class="info" data-astro-cid-axuhkfem><div class="lead" data-astro-cid-axuhkfem><p class="labels" data-astro-cid-axuhkfem><a href="/cantrip-cn-study/?c=principle" data-filter="c:principle" data-astro-cid-axuhkfem>设计原理</a><a href="/cantrip-cn-study/?t=scroll" data-filter="t:scroll" data-astro-cid-axuhkfem>滚动</a><a href="/cantrip-cn-study/?t=swipe" data-filter="t:swipe" data-astro-cid-axuhkfem>滑动</a><a href="/cantrip-cn-study/?t=click" data-filter="t:click" data-astro-cid-axuhkfem>点击</a><a href="/cantrip-cn-study/?t=keyboard" data-filter="t:keyboard" data-astro-cid-axuhkfem>键盘</a></p><h2 id="detail-title" data-astro-cid-axuhkfem>标签多到放不下</h2><p class="desc" data-astro-cid-axuhkfem>Ariakit 的作者 Haz 拆的一道老题：标签多到一排放不下。用鼠标的、用手指的、用键盘的，卡在不同的地方，一个标签栏得同时照顾好这三种人。</p><p class="byline" data-astro-cid-axuhkfem><a href="https://x.com/diegohaz/status/2122396486835020227" target="_blank" rel="noreferrer" data-astro-cid-axuhkfem>作者：Haz<svg width="1em" height="1em" viewBox="0 0 256 256" data-astro-cid-axuhkfem="true" data-icon="ph:arrow-up-right-bold"><path fill="currentColor" d="M204 64v104a12 12 0 0 1-24 0V93L72.49 200.49a12 12 0 0 1-17-17L163 76H88a12 12 0 0 1 0-24h104a12 12 0 0 1 12 12"/></svg></a><span class="sep" aria-hidden="true" data-astro-cid-axuhkfem>·</span><time datetime="2026-11-17" data-astro-cid-axuhkfem>2026 年 11 月 17 日</time></p></div><div class="side" data-astro-cid-axuhkfem><div class="actions single" data-astro-cid-axuhkfem><button class="btn primary t-press" type="button" data-copy-prompt="帮我把「标签多到放不下」这条做界面的规矩用到我的项目里。

规矩：一排标签放不下时，同一个标签栏要同时照顾三种人：用鼠标的（滚动条一藏就不知道怎么滚）、用手指的（看不出后面还有就不会划）、用键盘的（获得焦点的标签被箭头或淡出遮住）。
去哪找：所有可能放不下的横向列表：标签栏、筛选胶囊、分段控件、横向导航，尤其是写了 overflow-x: auto 又把滚动条藏起来的。
怎么改：两头做淡出，只在还有内容没露出的那一侧用 mask-image 渐隐，滚到头的一侧不淡（只做淡出可以用滚动驱动动画纯 CSS 实现；还要加箭头的，淡出和箭头共用同一份「哪侧还有内容」的判断）；桌面端在有内容的一侧放左右箭头按钮，点一下滚一段，滚到头时箭头先变暗、禁用，等指针移开再隐藏，免得它一消失就误点到下面的标签；箭头按钮不进 Tab 顺序，给滚动容器加 scroll-padding-inline（至少等于箭头加淡出的宽度），让获得焦点的标签整个露出来。
别这样做：不要只藏滚动条就完事，也不要让箭头一到头就立刻消失。
怎么验：只用鼠标（没有触控板）也能到最后一个标签；手机上一眼看得出能划；滚到头后连点箭头的位置不会点中别的标签；从第一个标签一路按 Tab，每个获得焦点的标签都完整可见。

先在我的代码里找出所有适用的地方，列出要改哪些、打算怎么改，等我确认再动手；改完告诉我怎么验证。

规矩和做法上面已经写全了，链接打不开也不影响。" data-gate="prompt" data-astro-cid-axuhkfem><svg width="1em" height="1em" viewBox="0 0 256 256" data-astro-cid-axuhkfem="true" data-icon="ph:copy-simple-bold"><path fill="currentColor" d="M180 64H40a12 12 0 0 0-12 12v140a12 12 0 0 0 12 12h140a12 12 0 0 0 12-12V76a12 12 0 0 0-12-12m-12 140H52V88h116Zm60-164v140a12 12 0 0 1-24 0V52H76a12 12 0 0 1 0-24h140a12 12 0 0 1 12 12"/></svg>复制提示词</button><button class="btn icon t-press" type="button" data-copy-link="/i/overflowing-tabs" aria-label="复制链接" title="复制链接" data-astro-cid-axuhkfem><svg width="1em" height="1em" viewBox="0 0 256 256" data-astro-cid-axuhkfem="true" data-icon="ph:link-simple-bold"><path fill="currentColor" d="m87.5 151.52l64-64a12 12 0 0 1 17 17l-64 64a12 12 0 0 1-17-17m131-114a60.08 60.08 0 0 0-84.87 0l-30.12 30.09a12 12 0 0 0 17 17l30.07-30.06a36 36 0 0 1 50.93 50.92l-30.11 30.05a12 12 0 1 0 17 17l30.08-30.06a60.09 60.09 0 0 0-.03-84.91ZM135.52 171.4l-30.07 30.08a36 36 0 0 1-50.92-50.93l30.06-30.07a12 12 0 0 0-17-17l-30.04 30.1a60 60 0 0 0 84.88 84.87l30.06-30.07a12 12 0 0 0-17-17Z"/></svg></button></div><dl class="meta" data-astro-cid-axuhkfem><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>英文</dt><dd lang="en" data-astro-cid-axuhkfem>Overflowing Tabs</dd></div><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>风格</dt><dd data-astro-cid-axuhkfem>极简、技术感</dd></div><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>色调</dt><dd data-astro-cid-axuhkfem>深色</dd></div></dl></div><section class="notes" data-astro-cid-axuhkfem><h3 data-astro-cid-axuhkfem>设计要点</h3><div data-astro-cid-axuhkfem><p>标签一多，最省事的办法是让它横着滚。可横向滚动条一露出来就难看；藏起来，用鼠标的人又不知道怎么滚过去。手机上本来用不着滚动条，但要是看不出后面还有，很多人根本不会去划。所以两头要做淡出：边上的字慢慢隐去，本身就在说「后面还有」。这和我收过的<a href="/cantrip-cn-study/i/progressive-blur-feed">渐进模糊列表</a>是同一个知识点：边缘不切一刀硬边，而是慢慢化开，人就知道内容还在往外延伸。这个网站桌面版顶上的筛选栏也是这么做的，我还专门出过一期视频讲渐进模糊。</p>
<p>桌面上加左右箭头按钮，又带出新的麻烦：滚到头，箭头一消失，鼠标底下露出来的是一个标签，人还按着刚才的节奏在点，就点错了。所以箭头到头时先别消失，变暗、点了没反应，等鼠标移开再拿掉。键盘也一样，一路按 Tab 过去，拿到焦点的标签要整个露出来，不能停在箭头或淡出区下面。</p>
<p>这几条单看都是小事，合起来说的是同一件事：同一个控件，鼠标、手指、键盘用起来是三样东西，只照着其中一种去做，另外两种人就会卡住。Haz 说这些几乎都能交给 CSS（遮罩、滚动驱动动画、scroll-padding），只有滚动本身要一点 JS。</p>
