(() => {
  const base = '/cantrip-cn-study';
  const withBase = value => {
    if (value instanceof URL) value = value.pathname + value.search + value.hash;
    if (typeof value !== "string" || !value.startsWith("/") || value.startsWith("//")) return value;
    if (value === base || value.startsWith(base + "/")) return value;
    return base + (value === "/" ? "/" : value);
  };
  const nativeFetch = window.fetch.bind(window);
  window.fetch = (input, init) => {
    if (typeof input === "string" || input instanceof URL) {
      const url = withBase(input);
      const method = init?.method ?? "GET";
      if (method !== "GET" && new URL(url, location.href).pathname.startsWith(base + "/api/"))
        return Promise.reject(new TypeError("Server APIs are not included in this static snapshot."));
      return nativeFetch(url, init);
    }
    if (input instanceof Request && new URL(input.url).origin === location.origin) {
      const url = withBase(new URL(input.url).pathname + new URL(input.url).search + new URL(input.url).hash);
      if (input.method !== "GET" && new URL(url, location.href).pathname.startsWith(base + "/api/"))
        return Promise.reject(new TypeError("Server APIs are not included in this static snapshot."));
      return nativeFetch(new Request(url, input), init);
    }
    return nativeFetch(input, init);
  };
  for (const method of ["pushState", "replaceState"]) {
    const original = history[method].bind(history);

  }
})();
</script></head><body><template data-detail-tpl="submenu-safe-triangle" data-at="16"><div data-part="info"><div class="info" data-astro-cid-axuhkfem><div class="lead" data-astro-cid-axuhkfem><p class="labels" data-astro-cid-axuhkfem><a href="/cantrip-cn-study/?c=principle" data-filter="c:principle" data-astro-cid-axuhkfem>设计原理</a><a href="/cantrip-cn-study/?t=hover" data-filter="t:hover" data-astro-cid-axuhkfem>悬停</a></p><h2 id="detail-title" data-astro-cid-axuhkfem>子菜单安全三角</h2><p class="desc" data-astro-cid-axuhkfem>Akash 把一个老模式做成了上下对照。斜着滑向子菜单时，途经的项不再把内容抢走；做对了没人察觉，没做才觉得菜单不听话。</p><p class="byline" data-astro-cid-axuhkfem><a href="https://x.com/a1x45h/status/2115805964725367180" target="_blank" rel="noreferrer" data-astro-cid-axuhkfem>作者：Akash<svg width="1em" height="1em" viewBox="0 0 256 256" data-astro-cid-axuhkfem="true" data-icon="ph:arrow-up-right-bold"><path fill="currentColor" d="M204 64v104a12 12 0 0 1-24 0V93L72.49 200.49a12 12 0 0 1-17-17L163 76H88a12 12 0 0 1 0-24h104a12 12 0 0 1 12 12"/></svg></a><span class="sep" aria-hidden="true" data-astro-cid-axuhkfem>·</span><time datetime="2026-11-06" data-astro-cid-axuhkfem>2026 年 11 月 6 日</time></p></div><div class="side" data-astro-cid-axuhkfem><div class="actions single" data-astro-cid-axuhkfem><button class="btn primary t-press" type="button" data-copy-prompt="帮我把「子菜单安全三角」这条做界面的规矩用到我的项目里。

规矩：鼠标从菜单项斜着移向它的子菜单，路线会擦过下面几项；没有保护时，经过哪项就切到哪项的子菜单。要在指针和子菜单之间留一块看不见的三角形安全区。
去哪找：所有悬停展开子菜单的地方：下拉菜单、右键菜单、多级导航、大菜单。先看用的菜单库是不是已经自带（比如 Radix 的子菜单自带这块区域），自带就不用重做。
怎么改：指针离开父菜单项时记下这一点，和子菜单靠近父菜单那一边的上下两角连成三角形；指针在三角形里移动时，忽略途经的其他项，不切换子菜单；指针停住一小会儿（约 100–300ms）还没进子菜单，才照常切换。子菜单往左展开时，三角也要反过来。
别这样做：不要只给切换加一个固定延迟，那样正常地上下移动也会变迟钝。
怎么验：从有子菜单的项斜着划向子菜单最远的一项，中途擦过别的项，子菜单不应被换掉；在菜单里正常上下移动，切换不应变慢。

先在我的代码里找出所有适用的地方，列出要改哪些、打算怎么改，等我确认再动手；改完告诉我怎么验证。

<p>做法是从指针离开菜单项的位置，向子菜单的上下两角连一个看不见的三角形。指针在三角形里时，菜单忽略其他项；停下片刻，才照常切换。演示里把这块区域染成淡蓝，两种做法上下对照。</p>
<p>这个模式不新：亚马逊的大类菜单和 macOS 的菜单都有类似处理。做对了没人察觉，没做才会觉得菜单不听话。</p>
