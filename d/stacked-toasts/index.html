<li>要读的时候，倒计时就该停：展开或拖拽时全部暂停，之后按剩余时间继续。每条底部的剩余时间线同时停住，「暂停」第一次能被看见。</li>
<li>后面的通知缩小上移、内容淡掉，只留卡片边缘；最多露出 3 条，不让堆栈变成一面墙。</li>
<li>堆叠位移用 CSS <code>transition</code> 而不是 keyframes：连点三下时每一条都在半路被重新定向，过渡能从当前位置平滑接上。</li>
<li>展开后条目之间的缝被补上，指针移到下一条时不会「掉出」悬停区。往下一甩就关，反方向越拉越沉。</li>
</ul>
