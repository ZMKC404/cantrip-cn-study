(() => {
  const base = '/cantrip-cn-study';
  const withBase = value => {
    if (value instanceof URL) value = value.pathname + value.search + value.hash;
    if (typeof value !== "string" || !value.startsWith("/") || value.startsWith("//")) return value;
    if (value === base || value.startsWith(base + "/")) return value;
    return base + (value === "/" ? "/" : value);
  };
  const nativeFetch = window.fetch.bind(window);
  window.fetch = (input, init) => {
    if (typeof input === "string" || input instanceof URL) {
      const url = withBase(input);
      const method = init?.method ?? "GET";
      if (method !== "GET" && new URL(url, location.href).pathname.startsWith(base + "/api/"))
        return Promise.reject(new TypeError("Server APIs are not included in this static snapshot."));
      return nativeFetch(url, init);

      const url = withBase(new URL(input.url).pathname + new URL(input.url).search + new URL(input.url).hash);
      if (input.method !== "GET" && new URL(url, location.href).pathname.startsWith(base + "/api/"))
        return Promise.reject(new TypeError("Server APIs are not included in this static snapshot."));
      return nativeFetch(new Request(url, input), init);
    }
    return nativeFetch(input, init);
  };
  for (const method of ["pushState", "replaceState"]) {

  }

</script></head><body><template data-detail-tpl="icon-side-padding" data-at="0"><div data-part="info"><div class="info" data-astro-cid-axuhkfem><div class="lead" data-astro-cid-axuhkfem><p class="labels" data-astro-cid-axuhkfem><a href="/cantrip-cn-study/?c=principle" data-filter="c:principle" data-astro-cid-axuhkfem>设计原理</a><a href="/cantrip-cn-study/?t=auto" data-filter="t:auto" data-astro-cid-axuhkfem>自动播放</a></p><h2 id="detail-title" data-astro-cid-axuhkfem>图标那侧少留白</h2><p class="desc" data-astro-cid-axuhkfem>Michael 的一条按钮小贴士：图标旁边要的空间比文字少。图标自己就带着一圈空白，两边量着一样宽，眼睛看到的却是图标那边更空。</p><p class="byline" data-astro-cid-axuhkfem><a href="https://x.com/MichaelFilipiuk/status/2122314262064546248" target="_blank" rel="noreferrer" data-astro-cid-axuhkfem>作者：Michael Filipiuk<svg width="1em" height="1em" viewBox="0 0 256 256" data-astro-cid-axuhkfem="true" data-icon="ph:arrow-up-right-bold"><path fill="currentColor" d="M204 64v104a12 12 0 0 1-24 0V93L72.49 200.49a12 12 0 0 1-17-17L163 76H88a12 12 0 0 1 0-24h104a12 12 0 0 1 12 12"/></svg></a><span class="sep" aria-hidden="true" data-astro-cid-axuhkfem>·</span><time datetime="2026-11-17" data-astro-cid-axuhkfem>2026 年 11 月 17 日</time></p></div><div class="side" data-astro-cid-axuhkfem><div class="actions single" data-astro-cid-axuhkfem><button class="btn primary t-press" type="button" data-copy-prompt="帮我把「图标那侧少留白」这条做界面的规矩用到我的项目里。

规矩：按钮里带图标时，图标那一侧的内边距要比文字那一侧小。图标自己带着一圈空白，两边数值一样，眼睛看到的是图标那侧更空。
去哪找：所有「图标 + 文字」的按钮，图标在前在后都算，包括按钮组件的各个变体、链接按钮、带下箭头的下拉按钮。纯文字、纯图标的按钮不用动。
怎么改：文字侧的内边距不变，只减图标侧，比文字侧少 4px 左右是常见的起点（如 16px → 12px），按项目的间距刻度取整；图标比字略小一点，图标和文字的间距收紧一点；播放三角、下拉箭头这类形状不规整的图标，再按眼睛看到的效果挪 1px 左右。
别这样做：不要两边一起减，也不要一个个按钮单独改；改按钮组件本身，让所有带图标的按钮一起生效。
怎么验：带图标和不带图标的按钮并排放，图标侧和文字侧的空白看起来一样宽。

先在我的代码里找出所有适用的地方，列出要改哪些、打算怎么改，等我确认再动手；改完告诉我怎么验证。

<p>Michael 的意思是把这一截收回来：图标那一侧少留一点，图标在前在后都一样。播放三角、下拉箭头这类形状不规整的图形，量着居中常常看着不正，也是同一个原因。说到底就一句话：空间按眼睛看到的分，不按数值分。</p>
<p>很多按钮说不上哪里不对，只是看着有点松、有点歪，问题常常就出在这几像素上。看过这条，再看自己做的按钮，会先去看图标那一侧。</p>
