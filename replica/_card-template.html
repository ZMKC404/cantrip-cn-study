<!-- ============================================================
   新增一张作品卡：把本文件里任一 <article> 块整体复制，
   粘到 replica/index.html 的 <div class="feed" data-feed-grid> 末尾即可。

   masonry / 详情浮层 / 搜索 / 分类筛选 / 收录计数 全部自动接管，
   唯一必改的是 5 个字段（下面标注 ★）。

   data-category 取值必须是现有 chip 的值之一：
     micro / component / interface / mobile / creative / principle
   想加新分类 → 同时在 toolbar 里加一个 chip：
     <a class="chip t-pill" href="./?c=你的值" data-chip="你的值">分类名</a>
   ============================================================ -->

<!-- ========== 形态 A：用截图/图片当卡面（最简单） ========== -->
<!-- 1. 把图片放进 replica/assets/   2. 改 ★ 的 5 处 -->
<article class="card"
  data-card
  data-slug="my-first-case"            <!-- ★ 唯一 slug，小写英文连字符，别重复 -->
  data-category="mobile"               <!-- ★ 分类（见顶部说明） -->
  data-tags="playful colorful auto"    <!-- 风格标签，空格分词，会进搜索索引 -->
  data-order="11">                     <!-- 排序序号，越大越靠前（配合"最新"排序） -->
  <a class="hit" data-open href="#i/my-first-case" aria-label="查看：你的标题"></a>
  <div class="top"><div class="media" style="aspect-ratio:720/560">  <!-- ★ 宽高比，竖屏 720/900 -->
    <img src="assets/your-shot.png" alt="" style="width:100%;height:100%;object-fit:cover">
  </div></div>
  <div class="text" data-frost>
    <h2 class="title">你的标题</h2>          <!-- ★ -->
    <p class="sub">一句话说清好在哪</p>
    <div class="foot">
      <p class="labels"><span>移动端</span></p>  <!-- ★ 和分类对应的中文名 -->
      <div class="acts"><button class="act copy t-icon-btn" data-copy-prompt-for="my-first-case" aria-label="复制提示词" title="复制提示词">
        <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M200 32h-36.3a44.9 44.9 0 0 0-71.4 0H56a16 16 0 0 0-16 16v168a16 16 0 0 0 16 16h144a16 16 0 0 0 16-16V48a16 16 0 0 0-16-16Z"/></svg>
      </button></div>
    </div>
  </div>
</article>
