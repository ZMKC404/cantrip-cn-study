"><path fill="currentColor" d="M71.68 97.22L34.74 128l36.94 30.78a12 12 0 1 1-15.36 18.44l-48-40a12 12 0 0 1 0-18.44l48-40a12 12 0 0 1 15.36 18.44m176 21.56l-48-40a12 12 0 1 0-15.36 18.44L221.26 128l-36.94 30.78a12 12 0 1 0 15.36 18.44l48-40a12 12 0 0 0 0-18.44M164.1 28.72a12 12 0 0 0-15.38 7.18l-64 176a12 12 0 0 0 7.18 15.37a11.8 11.8 0 0 0 4.1.73a12 12 0 0 0 11.28-7.9l64-176a12 12 0 0 0-7.18-15.38"/></svg>复制代码</button><a class="btn t-press" href="/code/file-format-fan" download="file-format-fan.html" data-gate="code" data-astro-cid-axuhkfem><svg width="1em" height="1em" viewBox="0 0 256 256" data-astro-cid-axuhkfem="true" data-icon="ph:download-simple-bold"><path fill="currentColor" d="M228 144v64a12 12 0 0 1-12 12H40a12 12 0 0 1-12-12v-64a12 12 0 0 1 24 0v52h152v-52a12 12 0 0 1 24 0m-108.49 8.49a12 12 0 0 0 17 0l40-40a12 12 0 0 0-17-17L140 115V32a12 12 0 0 0-24 0v83L96.49 95.51a12 12 0 0 0-17 17Z"/></svg>下载 HTML</a></div></div><dl class="meta" data-astro-cid-axuhkfem><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>英文</dt><dd lang="en" data-astro-cid-axuhkfem>File Format Fan</dd></div><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>风格</dt><dd data-astro-cid-axuhkfem>玻璃、柔和、趣味</dd></div><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>色调</dt><dd data-astro-cid-axuhkfem>多彩</dd></div><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>实现</dt><dd data-astro-cid-axuhkfem>CSS、JavaScript、SVG</dd></div></dl></div><section class="notes" data-astro-cid-axuhkfem><h3 data-astro-cid-axuhkfem>设计要点</h3><div data-astro-cid-axuhkfem><p>按界面复刻，原片是实拍屏幕。这里保留暖色桌面、文件和围绕拖动位置展开的操作，不模拟镜头推拉与屏幕透视；纸张内容和图标用中性矢量重写。</p>
<p>拖文件并按 Shift，格式围着文件排成扇区；方向选择与橙红高亮同步，中心文字确认当前目标。松手创建新的桌面文件，原文件留在原处，操作结果与来源能并排对照。</p>
<p>图片的操作环延续同一套方向选择，Crop Image 和 Add BG 接着进入暖色透底面板。界面演示支持这两项编辑及格式切换，其余操作保留原片中的扇区预览，不连接系统文件或真实转换服务。</p>
<p>裁剪时暗色遮罩标明舍弃部分，框内可移动、四角可缩放，切到 1:1 立即约束形状。背景面板的留白、圆角、阴影和比例直接更新预览，保存后桌面缩略图保留最终设置。</p>
<p>拖动不加延迟，展开与收起只用短促缓动；访客接管时停下演示手势，当前面板和参数继续可用。触摸可以直接拖动或点选，键盘也能选扇区、调整裁剪范围。</p>
