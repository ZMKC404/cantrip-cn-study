<p>箱子下面的三个圆点是升级机会，屏幕上写着「1 chance left!」。还剩几次一眼可数，用完就提示「Tap to open!」。</p>
<p>开箱的那一刻，卡片从背面翻到正面，最后落成一张写着奖励内容的红色卡片，下面再接「CONTINUE」。奖励先被藏起来，翻开才出现，这一步就是仪式感。</p>
