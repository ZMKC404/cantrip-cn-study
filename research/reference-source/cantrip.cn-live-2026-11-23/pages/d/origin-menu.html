<li>打开时用户在等，关闭时系统只是在回应，应该更快：进入 <code>180ms</code>，退出只要 <code>100ms</code>。</li>
<li><code>transform-origin</code> 设为触发器所在的角。单看察觉不到，但它让菜单像是从按钮里长出来的。</li>
<li>悬停高亮是一整块在滑动。首次进入菜单时只淡入不滑行；用方向键移动时直接跳过去，连按时滑行只会显得拖沓。</li>
<li>快捷键一键一个键帽，不把「⌘ ,」当成一串文字排，免得逗号看着像错字。</li>
</ul>
