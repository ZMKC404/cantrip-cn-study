17 17l30.07-30.06a36 36 0 0 1 50.93 50.92l-30.11 30.05a12 12 0 1 0 17 17l30.08-30.06a60.09 60.09 0 0 0-.03-84.91ZM135.52 171.4l-30.07 30.08a36 36 0 0 1-50.92-50.93l30.06-30.07a12 12 0 0 0-17-17l-30.04 30.1a60 60 0 0 0 84.88 84.87l30.06-30.07a12 12 0 0 0-17-17Z"/></svg></button></div><dl class="meta" data-astro-cid-axuhkfem><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>英文</dt><dd lang="en" data-astro-cid-axuhkfem>Learned Snap Sidebar</dd></div><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>风格</dt><dd data-astro-cid-axuhkfem>极简、技术感</dd></div><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>色调</dt><dd data-astro-cid-axuhkfem>浅色</dd></div></dl></div><section class="notes" data-astro-cid-axuhkfem><h3 data-astro-cid-axuhkfem>设计要点</h3><div data-astro-cid-axuhkfem><p>大多数人给侧栏留的宽度只有一个，但每次拖回去都差几个像素。Harsh 让侧栏自己学：每次松手的位置记成一个点，点不会正好重合，就各自堆一个小山包，挨得近的堆成大山包，最高那座就是你习惯的宽度。差不多三次拖动落在一处，吸附点才出现，偶然一次不算数。</p>
<p>习惯会变，所以新的记录更重：每过五次拖动，旧记录的分量减半，换了习惯几次就跟上。按拖动次数算，不按天算，一周没碰侧栏，它照样记得。吸附点定下来就不跟着每次拖动挪一个像素，只有最高的山包移出吸附范围才换位置。</p>
<p>吸附的老毛病是挨着吸附点的那几个像素到不了。Harsh 的解法是在吸附区里停 0.3 秒，吸附就松开，边缘跟回光标，不会跳一下；用方向键调宽度则永远不吸附。同样是拖侧栏的边，<a href="/i/bending-resize-handle">弯曲缩放把手</a>给的是手感，这里给的是记性。窗口上方那条曲线就是这些山包，在 Harsh 的文章里可以亲手拖着看，文末附了基于 react-resizable-panels 的完整代码。</p>
