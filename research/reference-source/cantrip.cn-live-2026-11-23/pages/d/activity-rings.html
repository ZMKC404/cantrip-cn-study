<li>「盖住」的层次感来自圆头的影子：末端圆头单独再画一次，阴影只落在被盖住的起点上，不弄脏自己身后的弧。</li>
<li>超过 100% 时第一圈保持满环，第二条弧从顶部再跑一遍；越过 100% 的那一刻，圆头放出一圈同色光环。</li>
<li>三环共用一个弹簧 <code>1.1s / bounce 0.2</code>，错开 <code>70ms</code>；切换时从当前速度直接改目标，不会先停再走。</li>
<li>数字全部 <code>tabular-nums</code>，滚动计数时宽度不变。达标的那一项，目标值换成圆环的颜色。</li>
</ul>
