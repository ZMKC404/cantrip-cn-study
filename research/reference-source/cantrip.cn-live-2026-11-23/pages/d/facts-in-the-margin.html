<p>接着填充词直接消失，事实不消失，而是飞到页边排成一列，标题写着「Facts removed」。哪条觉得该留，点一下它就飞回原句。角落一直显示字数（56 → 30 words），放回一条就多几个字，删多少、留多少自己掂量，最后再决定 Accept 还是 Discard，接受了也还能 Undo。</p>
<p>这和<a href="/i/subagent-task-fanout">任务分发流程</a>是同一个知识点：把 AI 在背后做的事摆到台面上，人才信得过它。这是 Yanis 用 Motion 做的一次设计探索，不是哪个产品里已有的功能。</p>
</div></section></div></div><div data-part="stage"><div class="slides" data-astro-cid-axuhkfem><figure class="slide" data-slide="0" style="--r:1;--mw:720px;--mwt:720px" data-astro-cid-axuhkfem><video class="m" src="/x/dev_ya-682097-hd.mp4" poster="/x/dev_ya-682097.webp" width="720" height="720" muted loop playsinline autoplay preload="auto" data-astro-cid-kg7vladn></video></figure></div></div></template></body></html>
