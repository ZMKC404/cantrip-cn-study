0 0 1 50.93 50.92l-30.11 30.05a12 12 0 1 0 17 17l30.08-30.06a60.09 60.09 0 0 0-.03-84.91ZM135.52 171.4l-30.07 30.08a36 36 0 0 1-50.92-50.93l30.06-30.07a12 12 0 0 0-17-17l-30.04 30.1a60 60 0 0 0 84.88 84.87l30.06-30.07a12 12 0 0 0-17-17Z"/></svg></button></div><dl class="meta" data-astro-cid-axuhkfem><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>英文</dt><dd lang="en" data-astro-cid-axuhkfem>Create Group Morph</dd></div><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>风格</dt><dd data-astro-cid-axuhkfem>极简、柔和</dd></div><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>色调</dt><dd data-astro-cid-axuhkfem>浅色</dd></div></dl></div><section class="notes" data-astro-cid-axuhkfem><h3 data-astro-cid-axuhkfem>设计要点</h3><div data-astro-cid-axuhkfem><p>建群通常要开一个弹窗、走几页表单，弹窗一关，建好的群在哪还得再找。Youssef 让整个流程都在一颗按钮里发生：「New group」长成卡片，选人、取名、挑颜色都在这张卡里换页，最后卡片收回成一颗绿色胶囊，写着群名、挂着成员头像。按钮是入口，也是结果。</p>
<p>每一步都带着前一步的结果走：选中的人，头像飞进标题栏，到了取名那页还挂在那里；「Next」上的数字跟着选了几个人变；输入群名时，头像里的缩写跟着变（Design team 就是 DT），换颜色它也跟着换。人不用记自己刚才选了什么，它一直摆在眼前。</p>
<p>这和<a href="/i/dynamic-island">灵动岛</a>是一个思路：小的和大的是同一个东西的两种尺寸，看得出它从哪里长出来，又收回了哪里。这个组件在 Youssef 的 Bluma 上能在线试，代码要买会员才能拿。</p>
