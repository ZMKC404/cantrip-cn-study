<li>白色外壳和浅灰底色几乎融在一起，边缘的细高光、灰色接缝和低对比阴影负责交代厚度，控件不靠深色描边也能被看见。</li>
<li>日历图标由黄蓝背板和透光前页叠成，小面积颜色藏在白色表层后面，保持了整组控件的轻盈感。</li>
<li>蓝色按钮把亮部放在边缘、饱和色留在中心，白色箭头有一点凹刻阴影，方向清楚而不刺眼。</li>
<li>日期只把当前项抬高并染红，三角指示器和星期保持独立；相邻项虽然淡，仍能直接点击切换。</li>
<li>窗口里其余内容只用低对比的骨架条占位，不和控件抢光；四组控件整体缩放，高光和阴影跟着一起变小，比例不走样。</li>
</ul>
