<li>堆着的时候不抖，捏起来会垂，甩出去会飞：自写的小刚体解算器，回弹只在撞得够快时才给。</li>
<li>抓取是挂在按下那个点上的软关节：捏住一端提起来，胶囊会垂下来摆。松手时把指针最后的速度混进去，甩一下就真的抛出去。</li>
<li>快速运动时沿位移叠几层半透明的样做运动模糊，重叠处叠回实心。</li>
<li>身后两堆不可交互的胶囊缩小、略抬高、整层平滑模糊并调淡，做出景深；中间那堆有自己的物理，和前景互不碰撞。初始的堆离线算好，静止后停止解算，一碰就醒。</li>
<li>触屏上，从空处开始的竖向滑动照常滚动页面，按在胶囊上才会抓起它。</li>
</ul>
