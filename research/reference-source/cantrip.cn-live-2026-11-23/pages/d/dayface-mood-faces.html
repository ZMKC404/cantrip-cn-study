<p>所以名字不常驻。一屏上只有八张脸，名字标签一次只在一张脸旁边冒出来，选项再多也不会挤成一片小字。</p>
<p>小脸的五官会往一边挪，像在转头张望。这点动静让它们像活的，挑心情就从填表变成了挑玩具，也就是 rishi 说的「用起来像在玩玩具」。</p>
