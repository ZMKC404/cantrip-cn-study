<p>橙红色的像素小怪站在原木上，是黑白画面里最显眼的一块颜色，旁边偶尔出现篝火、相机这样的小物件。背景几乎不动，眼睛自然落在它身上。</p>
<p>右上角的黑底小条显示正在播放的曲目，文字会滚动。这是一路陪人思考和做东西的音乐直播画面，要的是可以一直挂着、不抢注意力。</p>
