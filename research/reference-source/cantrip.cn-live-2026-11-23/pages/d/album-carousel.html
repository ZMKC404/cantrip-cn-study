<li>封面几乎侧立，只露出一条边，靠透视让两侧逐渐打开：一屏排得下十几张专辑，颜色和书脊文字一眼能扫过去，又不像平铺网格那样挤。</li>
<li>每张封面都把正面转向中间，左右两侧的翻面恰好发生在正中那张只剩一条线的时候（<code>87.5°</code>），滑动时看不到翻面那一下。</li>
<li>拖动、甩动和滚轮共用一个位置：松手时按速度外推一段再取整，弹簧带着松手速度滑到那一张，甩得越快走得越远。</li>
<li>点开时选中的封面从侧立转正、缩小落到专辑页左上角，背景同时换成封面主色，标题和曲目表最后淡入，底部的迷你播放器一直不动：同一张封面从列表走进详情，视线不用重新找。</li>
</ul>
