<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="robots" content="noindex"><link rel="stylesheet" href="/_astro/feed.i3oLm75g.css"><link rel="stylesheet" href="/_astro/DetailBody.CIetCpo6.css"></head><body><template data-detail-tpl="movebefore-embed-move" data-at="20"><div data-part="info"><div class="info" data-astro-cid-axuhkfem><div class="lead" data-astro-cid-axuhkfem><p class="labels" data-astro-cid-axuhkfem><a href="/?c=principle" data-filter="c:principle" data-astro-cid-axuhkfem>设计原理</a><a href="/?t=auto" data-filter="t:auto" data-astro-cid-axuhkfem>自动播放</a></p><h2 id="detail-title" data-astro-cid-axuhkfem>移动不重播</h2><p class="desc" data-astro-cid-axuhkfem>播放器挪个位置，不用从头再看。Gabriel 把两种写法并排比：appendChild 回到 00:00，moveBefore 从 00:11 接着放。</p><p class="byline" data-astro-cid-axuhkfem><a href="https://x.com/gabriell_lab/status/2108890580529099211" target="_blank" rel="noreferrer" data-astro-cid-axuhkfem>作者：Gabriel<svg width="1em" height="1em" viewBox="0 0 256 256" data-astro-cid-axuhkfem="true" data-icon="ph:arrow-up-right-bold"><path fill="currentColor" d="M204 64v104a12 12 0 0 1-24 0V93L72.49 200.49a12 12 0 0 1-17-17L163 76H88a12 12 0 0 1 0-24h104a12 12 0 0 1 12 12"/></svg></a><span class="sep" aria-hidden="true" data-astro-cid-axuhkfem>·</span><time datetime="2026-11-06" data-astro-cid-axuhkfem>2026 年 11 月 6 日</time></p></div><div class="side" data-astro-cid-axuhkfem><div class="actions single" data-astro-cid-axuhkfem><button class="btn primary t-press" type="button" data-copy-prompt="帮我把「移动不重播」这条做界面的规矩用到我的项目里。

规矩：把正在播放的视频、iframe 嵌入、正在输入的表单这类有状态的节点挪到页面别处时，appendChild、insertBefore 会先把它从文档里摘下再插回：iframe 重新加载、视频回到开头、焦点丢失。新的 moveBefore 只改位置，状态跟着走。
去哪找：小窗播放、把播放器从列表挪到详情、拖拽改布局，以及其他在两个容器之间搬同一个节点的代码。如果是框架渲染的，先确认是不是换了父元素导致整块重新挂载。
怎么改：搬节点时先判断 &quot;moveBefore&quot; in 目标父元素，有就 parent.moveBefore(node, 参照节点)，没有退回 parent.insertBefore(node, 参照节点)；moveBefore 要求节点和目标父元素都已挂在页面上，否则会抛错，用 try/catch 退回 insertBefore。
别这样做：不要靠克隆节点或重新设置 src 来「搬」，那等于重新加载。
怎么验：视频播到中途再挪位置，换位后应接着播，不回到 00:00；在支持 moveBefore 的浏览器（Chrome 133 起）和不支持的浏览器各试一次，后者至少不报错。

先在我的代码里找出所有适用的地方，列出要改哪些、打算怎么改，等我确认再动手；改完告诉我怎么验证。

<p>appendChild 的做法是先把 iframe 摘掉再插回去，页面当成新嵌入重新加载。moveBefore 只改位置，节点没离开文档，播放状态跟着走。</p>
<p>用法就两行：先判断 <code>"moveBefore" in slot</code>，有就调 <code>slot.moveBefore(player, null)</code>，没有退回 <code>slot.insertBefore(player, null)</code>。浏览器支持还不齐，退路要留。</p>
