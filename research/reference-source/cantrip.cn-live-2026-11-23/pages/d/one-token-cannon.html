<p>喷出来的不是贴图。票子在空中会弯、会翻面，各自落得快慢不同，所以满屏都是票也不显得整齐；每张都有票根和齿边，是电影院那种撕票，不是钞票。</p>
<p>枪本身也不是摆设。拉近看，底下浮出一排旋钮：主题、表面（cream / shiny / gold / smoky）、颜色、贴纸、油墨。贴纸点一下贴上去，拖着转方向，滚轮转角度，按住 Shift 滚轮改大小，退格删掉，Esc 退出，连这排面板都能按 H 收起来。一个纯为好玩做的东西，配了一整套可调项。</p>
