<li>先显示完整标题，再让一道解码波从左到右扫过。波到达之前字母保持原样，整行从不空白，像信号扫过，而不是从空白入场。</li>
<li>落定时真实字形和乱码交叉淡化，落定的那一帧不会先空一下。</li>
<li>指针扫过哪个词，就只重洗那个词。触摸时手指按下或横着滑过的词依次重洗，上下仍能滚动页面。</li>
</ul>
