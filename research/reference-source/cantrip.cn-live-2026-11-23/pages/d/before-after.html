<li>线框和成品是同一份 DOM、两套皮肤：线框层只换颜色、描边和占位，几何一点不动，所以分割线两侧永远对得上。橙色手写批注只画在线框层上，跟着线框一起被揭开。</li>
<li>上层用 <code>clip-path: inset()</code> 裁切，分割线用 <code>translate3d</code> 移动，整个拖动只碰合成属性。按住把手或在窗口任意位置按下都能拖。</li>
<li>静止时分割线停在 <code>42%</code>：大半是成品，左边露出一条线框和两条批注。拖出边界时只有把手带着阻尼跟出去一点，松手弹回边缘。</li>
<li>「线框 / 成品」角标随位置淡入淡出，哪一边快被挤没了，它的标签就先退场。</li>
</ul>
