<li>显示密码通常是全有或全无；做成探照灯后，一次只露出光照到的几位，想核对哪段就照哪段。</li>
<li>光的方向挂在弹簧上（<code>k = 40</code>、阻尼比 <code>0.7</code>），不是直接对准指针：慢半拍转过去，停下时略微过头，像有人在转灯。</li>
<li>指针停下一会儿，眼睛就自己四处扫，像在找人；手一动，光又追回指针。</li>
<li>判定用角度而不是矩形相交：以眼睛为原点算每个字符的方位角，落进 <code>12°</code> 半角就显示，边缘 <code>2°</code> 内渐变，明暗交界随光束平滑推进。</li>
<li>真实的 input 只管输入和光标，文字透明；上面叠一层等宽的逐字 span 显示圆点或明文，光标和字符始终对齐。</li>
</ul>
