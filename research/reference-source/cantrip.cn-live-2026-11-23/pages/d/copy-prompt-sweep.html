<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="robots" content="noindex"><link rel="stylesheet" href="/_astro/feed.i3oLm75g.css"><link rel="stylesheet" href="/_astro/DetailBody.CIetCpo6.css"></head><body><template data-detail-tpl="copy-prompt-sweep" data-at="2"><div data-part="info"><div class="info" data-astro-cid-axuhkfem><div class="lead" data-astro-cid-axuhkfem><p class="labels" data-astro-cid-axuhkfem><a href="/?c=micro" data-filter="c:micro" data-astro-cid-axuhkfem>微交互与动效</a><a href="/?t=click" data-filter="t:click" data-astro-cid-axuhkfem>点击</a></p><h2 id="detail-title" data-astro-cid-axuhkfem>彩光扫过的复制键</h2><p class="desc" data-astro-cid-axuhkfem>Petar 把换字藏在一道光后面：「Copy prompt」变成「Copied!」的那一下，正好被扫过的渐变光盖住，眼睛看到的是光走过去，不是字闪一下。</p><p class="byline" data-astro-cid-axuhkfem><a href="https://x.com/kippe07/status/2122278471090966873" target="_blank" rel="noreferrer" data-astro-cid-axuhkfem>作者：Petar Cirkovic<svg width="1em" height="1em" viewBox="0 0 256 256" data-astro-cid-axuhkfem="true" data-icon="ph:arrow-up-right-bold"><path fill="currentColor" d="M204 64v104a12 12 0 0 1-24 0V93L72.49 200.49a12 12 0 0 1-17-17L163 76H88a12 12 0 0 1 0-24h104a12 12 0 0 1 12 12"/></svg></a><span class="sep" aria-hidden="true" data-astro-cid-axuhkfem>·</span><time datetime="2026-11-17" data-astro-cid-axuhkfem>2026 年 11 月 17 日</time></p></div><div class="side" data-astro-cid-axuhkfem><div class="actions single" data-astro-cid-axuhkfem><button class="btn primary t-press" type="button" data-copy-prompt="帮我在项目里做一个「彩光扫过的复制键」：Petar 把换字藏在一道光后面：「Copy prompt」变成「Copied!」的那一下，正好被扫过的渐变光盖住，眼睛看到的是光走过去，不是字闪一下。
画面：白底中间一枚浅灰胶囊按钮，左边叠着三个白色圆形图标（橙色星芒、黑色立方体、黑色绳结），右边写「Copy prompt」；点击后一道紫到橙的渐变光从左扫到右，文字换成「Copied!」，光随后淡去。

原作：https://x.com/kippe07/status/2122278471090966873
效果演示：https://cantrip.cn/i/copy-prompt-sweep

照原作的交互和动效来做，写法换成我项目现有的技术栈和样式。打不开链接就先告诉我，我把内容贴给你，不要凭标题猜。" data-gate="prompt" data-astro-cid-axuhkfem><svg width="1em" height="1em" viewBox="0 0 256 256" data-astro-cid-axuhkfem="true" data-icon="ph:copy-simple-bold"><path fill="currentColor" d="M180 64H40a12 12 0 0 0-12 12v140a12 12 0 0 0 12 12h140a12 12 0 0 0 12-12V76a12 12 0 0 0-12-12m-12 140H52V88h116Zm60-164v140a12 12 0 0 1-24 0V52H76a12 12 0 0 1 0-24h140a12 12 0 0 1 12 12"/></svg>复制提示词</button><button class="btn icon t-press" type="button" data-copy-link="/i/copy-prompt-sweep" aria-label="复制链接" title="复制链接" data-astro-cid-axuhkfem><svg width="1em" height="1em" viewBox="0 0 256 256" data-astro-cid-axuhkfem="true" data-icon="ph:link-simple-bold"><path fill="currentColor" d="m87.5 151.52l64-64a12 12 0 0 1 17 17l-64 64a12 12 0 0 1-17-17m131-114a60.08 60.08 0 0 0-84.87 0l-30.12 30.09a12 12 0 0 0 17 17l30.07-30.06a36 36 0 0 1 50.93 50.92l-30.11 30.05a12 12 0 1 0 17 17l30.08-30.06a60.09 60.09 0 0 0-.03-84.91ZM135.52 171.4l-30.07 30.08a36 36 0 0 1-50.92-50.93l30.06-30.07a12 12 0 0 0-17-17l-30.04 30.1a60 60 0 0 0 84.88 84.87l30.06-30.07a12 12 0 0 0-17-17Z"/></svg></button></div><dl class="meta" data-astro-cid-axuhkfem><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>英文</dt><dd lang="en" data-astro-cid-axuhkfem>Copy Prompt Sweep</dd></div><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>风格</dt><dd data-astro-cid-axuhkfem>柔和、极简</dd></div><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>色调</dt><dd data-astro-cid-axuhkfem>浅色</dd></div></dl></div><section class="notes" data-astro-cid-axuhkfem><h3 data-astro-cid-axuhkfem>设计要点</h3><div data-astro-cid-axuhkfem><p>复制本身没有画面，剪贴板看不见，只能靠按钮把它演出来。这和<a href="/i/receipt-printer">订阅小票</a>把看不见的付款变成一张吐出来的小票是一个思路，只是复制又快又小，用不着一张纸，一道光就够了。</p>
<p>最常见的做法是把字直接换成「Copied!」，一换就完，眼睛容易错过，按钮还像跳了一下。Petar 让一道紫到橙的光带从左往右扫过按钮，字就在光带经过的地方被换掉：突变被光盖住了，留下的是一个有方向的动作。光从 AI 工具图标那头出发，方向本身就像在说「送过去了」。</p>
<p>扫完光就淡掉，「Copied!」停一会儿再退回原样，反馈只占点击后的一两秒，按钮又是那枚安静的灰色胶囊。</p>
</div></section></div></div><div data-part="stage"><div class="slides" data-astro-cid-axuhkfem><figure class="slide" data-slide="0" style="--r:1;--mw:720px;--mwt:720px" data-astro-cid-axuhkfem><video class="m" src="/x/kippe07-966873-hd.mp4" poster="/x/kippe07-966873.webp" width="720" height="720" muted loop playsinline autoplay preload="auto" data-astro-cid-kg7vladn></video></figure></div></div></template></body></html>
