hkfem><svg width="1em" height="1em" viewBox="0 0 256 256" data-astro-cid-axuhkfem="true" data-icon="ph:globe-simple-bold"><path fill="currentColor" d="M128 20a108 108 0 1 0 108 108A108.12 108.12 0 0 0 128 20m83.13 96h-31.57a144.3 144.3 0 0 0-21.35-66.36A84.22 84.22 0 0 1 211.13 116M128 207c-9.36-10.81-24.46-33.13-27.45-67h54.94a119.74 119.74 0 0 1-17.11 52.77A108.6 108.6 0 0 1 128 207m-27.45-91a119.74 119.74 0 0 1 17.11-52.77A108.6 108.6 0 0 1 128 49c9.36 10.81 24.46 33.13 27.45 67Zm-2.76-66.36A144.3 144.3 0 0 0 76.44 116H44.87a84.22 84.22 0 0 1 52.92-66.36M44.87 140h31.57a144.3 144.3 0 0 0 21.35 66.36A84.22 84.22 0 0 1 44.87 140m113.34 66.36A144.3 144.3 0 0 0 179.56 140h31.57a84.22 84.22 0 0 1-52.92 66.36"/></svg>在线体验<svg width="1em" height="1em" viewBox="0 0 256 256" class="out" data-astro-cid-axuhkfem="true" data-icon="ph:arrow-up-right-bold"><path fill="currentColor" d="M204 64v104a12 12 0 0 1-24 0V93L72.49 200.49a12 12 0 0 1-17-17L163 76H88a12 12 0 0 1 0-24h104a12 12 0 0 1 12 12"/></svg></a><button class="btn icon t-press" type="button" data-copy-link="/i/film-strip-tooltip" aria-label="复制链接" title="复制链接" data-astro-cid-axuhkfem><svg width="1em" height="1em" viewBox="0 0 256 256" data-astro-cid-axuhkfem="true" data-icon="ph:link-simple-bold"><path fill="currentColor" d="m87.5 151.52l64-64a12 12 0 0 1 17 17l-64 64a12 12 0 0 1-17-17m131-114a60.08 60.08 0 0 0-84.87 0l-30.12 30.09a12 12 0 0 0 17 17l30.07-30.06a36 36 0 0 1 50.93 50.92l-30.11 30.05a12 12 0 1 0 17 17l30.08-30.06a60.09 60.09 0 0 0-.03-84.91ZM135.52 171.4l-30.07 30.08a36 36 0 0 1-50.92-50.93l30.06-30.07a12 12 0 0 0-17-17l-30.04 30.1a60 60 0 0 0 84.88 84.87l30.06-30.07a12 12 0 0 0-17-17Z"/></svg></button></div><dl class="meta" data-astro-cid-axuhkfem><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>英文</dt><dd lang="en" data-astro-cid-axuhkfem>Film-Strip Tooltip</dd></div><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>风格</dt><dd data-astro-cid-axuhkfem>极简</dd></div><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>色调</dt><dd data-astro-cid-axuhkfem>深色</dd></div></dl></div><section class="notes" data-astro-cid-axuhkfem><h3 data-astro-cid-axuhkfem>设计要点</h3><div data-astro-cid-axuhkfem><p>常见的工具栏提示是每个按钮各带一个，从一个移到下一个，就是一灭一亮。John 反过来做：六个工具名连同快捷键横着排成一条，提示框是开在这条胶片上的窗。悬停到哪个按钮，窗就滑到它上方、宽度变成那个名字的宽，胶片同时在窗里滑动，旧名字从一边出去，新名字从另一边进来。字不是被换掉的，是被带过去的。这和<a href="/i/price-ticker">滚动价格</a>里数字像里程表一样转到新值、<a href="/i/tab-clip">胶囊标签栏</a>里新内容从你前进的那边滑进来，是同一个思路：变化有来处、有方向，眼睛就跟得上。</p>
<p>几处细节让它连成一个动作：窗的位置、宽度和胶片用同一个弹簧一起动，不回弹；动得快时字会糊一点（最多 1px），像胶片走得太快留下的拖影；按钮之间的空隙有 90 毫秒的缓冲，从一个移到下一个，提示不会闪掉；第一次出现时就在原地淡入，不会从别处飞过来。悬停的浅灰圆底也跟着窗的中心走。</p>
<p>用键盘 Tab 到按钮上同样会出提示，手机上点一下会显示一会儿。Kit 上这个组件免费，代码和提示词都能直接复制。</p>
