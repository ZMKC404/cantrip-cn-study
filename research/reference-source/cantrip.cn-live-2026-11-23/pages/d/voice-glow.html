<li>松开后光晕是慢慢呼出去的，不是被掐断：音量按 VU 表处理，起得快、落得慢，整体「清醒度」再叠一层更慢的包络。</li>
<li>光晕分三层叠在面板底部、被圆角裁切，后两层用 <code>mix-blend-mode: screen</code>，颜色相加而不是相盖。</li>
<li>模糊放在会动的元素自己身上，不放在父层；动画只改 <code>transform</code> 和 <code>opacity</code>。静止时缩成一点余光，用 CSS 动画沿底边慢慢漂移，不占主线程。</li>
<li>按住说话，轻点进入免按模式；转写每出一个词就模糊上浮浮现。</li>
</ul>
