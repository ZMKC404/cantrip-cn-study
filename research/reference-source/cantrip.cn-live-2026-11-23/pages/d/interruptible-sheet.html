<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="robots" content="noindex"><link rel="stylesheet" href="/_astro/feed.i3oLm75g.css"><link rel="stylesheet" href="/_astro/DetailBody.CIetCpo6.css"></head><body><template data-detail-tpl="interruptible-sheet" data-at="18"><div data-part="info"><div class="info" data-astro-cid-axuhkfem><div class="lead" data-astro-cid-axuhkfem><p class="labels" data-astro-cid-axuhkfem><a href="/?c=principle" data-filter="c:principle" data-astro-cid-axuhkfem>设计原理</a><a href="/?t=click" data-filter="t:click" data-astro-cid-axuhkfem>点击</a></p><h2 id="detail-title" data-astro-cid-axuhkfem>接住第二次点击</h2><p class="desc" data-astro-cid-axuhkfem>点开面板又反悔，再点一下，它就该顺势折回来。Juliette 把三种处理并排对照：留住动量、先减速再反向的那种，看起来是一整个动作。</p><p class="byline" data-astro-cid-axuhkfem><a href="https://x.com/shedsgns/status/2112770856396931506" target="_blank" rel="noreferrer" data-astro-cid-axuhkfem>作者：Juliette<svg width="1em" height="1em" viewBox="0 0 256 256" data-astro-cid-axuhkfem="true" data-icon="ph:arrow-up-right-bold"><path fill="currentColor" d="M204 64v104a12 12 0 0 1-24 0V93L72.49 200.49a12 12 0 0 1-17-17L163 76H88a12 12 0 0 1 0-24h104a12 12 0 0 1 12 12"/></svg></a><span class="sep" aria-hidden="true" data-astro-cid-axuhkfem>·</span><time datetime="2026-11-06" data-astro-cid-axuhkfem>2026 年 11 月 6 日</time></p></div><div class="side" data-astro-cid-axuhkfem><div class="actions single" data-astro-cid-axuhkfem><button class="btn primary t-press" type="button" data-copy-prompt="帮我把「接住第二次点击」这条做界面的规矩用到我的项目里。

规矩：面板、抽屉、弹层在动画途中，用户可能马上改主意再点一下。这时不能无视这次点击，也不该从当前位置零速度重新起步，要顺着当前速度先减速、再反向，看起来是一个连续的动作。
去哪找：点一下开、再点一下关的东西：底部面板、侧边抽屉、折叠面板、下拉菜单；特别是动画期间锁住点击的（isAnimating 之类），和用固定时长的 CSS transition 或 keyframes 做的。
怎么改：去掉动画期间的点击锁；位置交给弹簧驱动（Motion、React Spring 或自己写的弹簧），新目标进来时从当前位置和当前速度接着算。CSS transition 半路反向时会从当前值出发，但速度不保留，要连贯就换成弹簧。
别这样做：不要等动画播完再响应，也不要反向时让面板瞬间跳到某个位置。
怎么验：打开到一半时再点一次，面板应先顺着原方向减速再折回，没有停顿、没有跳变。

先在我的代码里找出所有适用的地方，列出要改哪些、打算怎么改，等我确认再动手；改完告诉我怎么验证。

<p>每台手机下方的蓝色曲线随面板运动起伏。第三种反向前先顺着原有动量减速，所以反向时看起来是一个连续的动作。</p>
