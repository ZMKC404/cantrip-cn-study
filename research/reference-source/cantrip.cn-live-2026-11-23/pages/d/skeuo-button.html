ill="currentColor" d="M71.68 97.22L34.74 128l36.94 30.78a12 12 0 1 1-15.36 18.44l-48-40a12 12 0 0 1 0-18.44l48-40a12 12 0 0 1 15.36 18.44m176 21.56l-48-40a12 12 0 1 0-15.36 18.44L221.26 128l-36.94 30.78a12 12 0 1 0 15.36 18.44l48-40a12 12 0 0 0 0-18.44M164.1 28.72a12 12 0 0 0-15.38 7.18l-64 176a12 12 0 0 0 7.18 15.37a11.8 11.8 0 0 0 4.1.73a12 12 0 0 0 11.28-7.9l64-176a12 12 0 0 0-7.18-15.38"/></svg>复制代码</button><a class="btn t-press" href="/code/skeuo-button" download="skeuo-button.html" data-gate="code" data-astro-cid-axuhkfem><svg width="1em" height="1em" viewBox="0 0 256 256" data-astro-cid-axuhkfem="true" data-icon="ph:download-simple-bold"><path fill="currentColor" d="M228 144v64a12 12 0 0 1-12 12H40a12 12 0 0 1-12-12v-64a12 12 0 0 1 24 0v52h152v-52a12 12 0 0 1 24 0m-108.49 8.49a12 12 0 0 0 17 0l40-40a12 12 0 0 0-17-17L140 115V32a12 12 0 0 0-24 0v83L96.49 95.51a12 12 0 0 0-17 17Z"/></svg>下载 HTML</a></div></div><dl class="meta" data-astro-cid-axuhkfem><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>英文</dt><dd lang="en" data-astro-cid-axuhkfem>Sunken Pill Key</dd></div><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>风格</dt><dd data-astro-cid-axuhkfem>拟物、极简</dd></div><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>色调</dt><dd data-astro-cid-axuhkfem>浅色</dd></div><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>实现</dt><dd data-astro-cid-axuhkfem>CSS</dd></div></dl></div><section class="notes" data-astro-cid-axuhkfem><h3 data-astro-cid-axuhkfem>设计要点</h3><div data-astro-cid-axuhkfem><ul>
<li>凸起和凹陷是同一组八层阴影，顺序一一对应，只换数值，所以浏览器能逐层插值：投影收起、顶上柔光熄灭、四周压出一圈黑边。</li>
<li>凸起时顶上一条宽而软的高光，底下一道 <code>1px</code> 黑线贴着桌面，再往下是近处深、远处淡的两层投影；按钮上方还有一圈淡影，是按钮所在的那个坑，两种状态都在。</li>
<li>按下后上沿和左沿的黑边最厚，底部内沿另有一道窄暗边，中间的平台往右下挪一点，看上去整块往下沉了。</li>
<li>按下和松开都是 <code>200ms</code> 左右的缓出，不回弹，是被压下去而不是被弹开。</li>
<li>空格或回车按住就是手指按住，抬键才弹起，键盘也能看到完整的按下状态。</li>
</ul>
</div></section></div></div><div data-part="stage"><div class="slides" data-astro-cid-axuhkfem><figure class="slide" data-slide="0" style="--r:1.4666666666666666;--mw:748px;--mwt:550px" data-theme="light" data-astro-cid-axuhkfem><div class="m m-demo" data-demo="skeuo-button" data-demo-live data-theme="light" style="background:#dfdfdf" data-astro-cid-kg7vladn><img class="m-poster" src="/posters/skeuo-button.webp" width="440" height="300" alt="" loading="eager" decoding="async" draggable="false" data-poster data-astro-cid-kg7vladn></div></figure></div><div class="stage-chrome" data-stage-chrome aria-hidden="true" data-astro-cid-axuhkfem></div></div></template></body></html>
