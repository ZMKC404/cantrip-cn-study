<p>身上一节节的环，成了装甲环段「SEGMENTED TORSO RINGS」。那张吞沙的圆口，成了旋转钻头「ROTARY DRILL ASSEMBLY」，口沿一圈 32 片推沙的刀片「DISPLACEMENT BLADES」。在沙里一拱一拱地前进，写成了动力系统「PERISTALTIC LINEAR DRIVE」，也就是蠕动式推进，底部还画着它的运动周期「LOCOMOTION CYCLE」。每个零件都对得上电影里那条虫的一个特征，所以这台机器看着陌生，又说得通它为什么长成这样。</p>
<p>身份也跟着换了。弗雷曼人敬畏的神，在这里是一台编号「SANDWORM MK-X」的无人挖掘设备：乘员一栏写着「NONE (AUTONOMOUS)」，动力是「FUSION / THERMOELECTRIC」。神被写成一台设备，好玩就好玩在这份认真。</p>
<p>工程图纸、六个视角和 X 光，都是为了让这台机器显得真：参数和剖面围在四周，中间留给沙虫；打开 X 光，能看到沙面下还埋着长长一截。</p>
