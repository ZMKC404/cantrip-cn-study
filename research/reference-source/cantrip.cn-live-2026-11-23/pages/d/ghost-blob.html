<li>它会看你，也能被拎起来甩：眼睛跟着指针看，隔几秒眨一次眼，戳一下眯成开心的眼睛。</li>
<li>轮廓是一圈各自带弹簧的点，尾巴附近更软，所以总比身体晚半拍。点只感受加速度：匀速移动时不拖影，起停和撞墙才晃。</li>
<li>尾巴总在指针的另一侧；沿速度方向保体积拉伸、前倾。</li>
<li>松手后带着手速飞出去，空气阻力和轻微下坠让它慢慢停下；撞到画面边缘会压扁一侧，再被一股渐强的拉力带回中间。</li>
</ul>
