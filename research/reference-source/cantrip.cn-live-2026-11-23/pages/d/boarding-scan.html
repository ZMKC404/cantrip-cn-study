<li>刷卡有手感，是因为位置和倾角各用一个弹簧：位置跟手很紧，倾角软而会晃，甩一下会晃，停手会回正。</li>
<li>下沿越过读卡口就「落槽」：层级换到机身后面，短促一弹后只能横向滑，往上拉一段才拔得出来。</li>
<li>读卡器嫌你刷得太快：速度超过上限就红灯、屏幕报 ERROR、机身左右抖动、进度清零；往回退会重新起算。</li>
<li>通过后转绿，登机牌带着当前速度向右上甩出，片刻后从上方递来新的一张。</li>
</ul>
