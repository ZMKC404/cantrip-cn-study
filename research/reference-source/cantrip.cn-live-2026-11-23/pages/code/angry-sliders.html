<!doctype html>
<!--
  弹弓滑块 · Slingshot Sliders
  Cantrip 的一条交互实现：https://cantrip.cn/i/angry-sliders
  原作：gsimone（@ggsimm）  https://x.com/ggsimm/status/2099497518627184949
  这是 Cantrip 照着原作重写的实现，不是原作者的源码。

  怎么用
    · 用浏览器直接打开这个文件就能玩，不用构建。
    · <script type="module"> 里依次是：Cantrip 的 Demo 运行时（mountDemo 等，
      负责缩放画板、注入样式、管理事件），然后是这个 Demo 本身
      （defineDemo({ width, height, css, setup })），最后一行把它挂到 #demo 上。
    · 搬进自己的项目：交互都在 setup() 里，ctx.root 是画板元素；css 里的
      :scope 会被替换成 .d-angry-sliders。不需要演示脚本的话，script/reset 可以删掉。

  依赖
    · 无。原生 JS + CSS，离线也能打开。

  源文件：src/demos/angry-sliders.ts 与 src/demos/_kit.ts（构建时生成）。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>弹弓滑块 · Cantrip</title>
<style>
/* 页面：画板居中，四周留白。 */
html, body { height: 100%; }
body {
  margin: 0;
  display: grid;
  place-items: safe center;
  padding: 16px;
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
  -webkit-tap-highlight-color: transparent;
}
/* 画板的底边本来就裁在内容中间的 Demo（bleed）：#demo 铺满窗口，裁口落在窗口底边。 */
body.bleed { display: block; padding: 0; }
body.bleed #demo { height: 100vh; height: 100dvh; }
#demo { position: relative; width: 100%; overflow: hidden; }

/* 基础重置（节选自 Tailwind preflight，站点上 Demo 就是在它之上画的）。 */
@layer reset {
  *, ::before, ::after { box-sizing: border-box; margin: 0; padding: 0; border: 0 solid; }
  h1, h2, h3, h4, h5, h6 { font-size: inherit; font-weight: inherit; }
  a { color: inherit; text-decoration: inherit; }
  ol, ul, menu { list-style: none; }
  img, svg, video, canvas { display: block; vertical-align: middle; }
  img, video { max-width: 100%; height: auto; }
  button, input, select, textarea {
    font: inherit; letter-spacing: inherit; color: inherit;
    border-radius: 0; background-color: transparent; opacity: 1;
  }
  button { cursor: pointer; }
  ::placeholder { opacity: 1; color: color-mix(in oklab, currentcolor 50%, transparent); }
  [hidden]:where(:not([hidden="until-found"])) { display: none !important; }
}

/* 画板：固定尺寸，由运行时按容器等比缩放。 */
.demo-artboard {
  position: absolute;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
  font-size: 14px;
  line-height: 1.4;
  color: #111;
  text-align: left;
  -webkit-font-smoothing: antialiased;
}
.demo-artboard[data-theme="dark"] { color: #f5f5f5; }
.demo-artboard :where(button, input) { font: inherit; color: inherit; }
.demo-artboard:not([inert]) { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.demo-artboard :where(input, textarea, [contenteditable]) { -webkit-user-select: text; user-select: text; }
.demo-artboard[tabindex="-1"]:focus { outline: none; }
</style>
</head>
<body>
<div id="demo"></div>
<script type="module">
/* 这个 Demo 没用 Motion。运行时里只有演示脚本的假光标会调用 animate，
   导出版不跑演示脚本，所以放一个占位，省掉整个依赖。 */
const animate = () => {
  throw new Error("animate() is only used by the scripted walkthrough");
};

/* ==================================================================
   Cantrip 的 Demo 运行时（src/demos/_kit.ts）
   ================================================================== */

/* The runtime every live demo shares.

   A demo is authored once, at a fixed artboard size, and shown in two places:
   shrunk into a feed card, where it plays a scripted walkthrough on a loop
   with a fake cursor (the way a screen recording would), and blown up on the
   detail stage, where the same walkthrough runs until the visitor reaches in
   and takes over. The artboard is scaled with a transform rather than being
   re-laid out, so a demo looks identical at 260px and at 700px. */

const defineDemo = (demo) => demo;

/** Tag for the `css` field - identity, it just marks the string for editors. */
const css = String.raw;

const springs = {
  snappy: { type: "spring", duration: 0.3, bounce: 0.15 },
  smooth: { type: "spring", duration: 0.5, bounce: 0.1 },
  bouncy: { type: "spring", duration: 0.55, bounce: 0.35 },
};

const ease = {
  out: [0.23, 1, 0.32, 1],
  inOut: [0.77, 0, 0.175, 1],
  drawer: [0.32, 0.72, 0, 1],
};

function h(
  tag,
  props = {},
  ...children
) {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (key === "class") el.className = value;
    else el.setAttribute(key, value);
  }
  el.append(...children);
  return el;
}

/* ------------------------------------------------------------------ */
/* Mounting                                                            */
/* ------------------------------------------------------------------ */

const CANCELLED = Symbol("cancelled");
const injected = new Set();

function inject(id, source) {
  if (!source || injected.has(id)) return;
  injected.add(id);
  const style = document.createElement("style");
  style.dataset.demo = id;
  style.textContent = source.replaceAll(":scope", `.d-${id}`);
  document.head.append(style);
}

const CURSOR_SVG = `<svg viewBox="0 0 20 24" width="20" height="24" aria-hidden="true"><path d="M2.2 1.6v17.6l4.5-4.2 3 6.6 3.1-1.4-3-6.4h6.3z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>`;

function mountDemo(
  frame,
  id,
  demo,
  { live = false, maxScale = Infinity, focus = false, autoplay = true } = {},
) {
  inject(id, demo.css);
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  // A phone has no arrow: there the walkthrough is drawn as a fingertip.
  const touch = matchMedia("(hover: none) and (pointer: coarse)").matches;
  const mount = new AbortController();
  const listeners = new Set();

  const root = document.createElement("div");
  root.className = `demo-artboard d-${id}`;
  root.dataset.theme = demo.theme ?? "light";
  root.style.width = `${demo.width}px`;
  root.style.height = `${demo.height}px`;
  if (demo.background) root.style.background = demo.background;
  if (!live) root.inert = true;
  frame.append(root);

  /* A walkthrough presses its buttons with .click(): those clicks are the
     demo's business only. Bubbling on, one reached the feed card around a
     demo and opened its detail by itself. The demo's own listeners - on the
     artboard or anything inside it - have all run by the time this does. */
  for (const type of ["click", "dblclick", "pointerdown", "pointerup", "mousedown", "mouseup", "keydown", "keyup", "input", "change"]) {
    root.addEventListener(type, (e) => e.isTrusted || e.stopPropagation(), { signal: mount.signal });
  }

  let scale = 1;

  /* ---- pause plumbing: timers and animations all hang off this ---- */
  let paused = false;
  let frozen = [];
  const onPause = new Set();
  const onResume = new Set();

  let script = new AbortController();

  const cancelled = () => Object.assign(new Error("cancelled"), { [CANCELLED]: true });

  /* A timeout whose countdown stops while the demo is paused. It belongs to
     the mount, not to a script run - only unmount or `cancel` clears it. */
  const later = (fn, ms) => {
    if (mount.signal.aborted) return () => {};
    let remaining = ms;
    let started = 0;
    let timer = 0;
    const run = () => {
      started = performance.now();
      timer = window.setTimeout(fire, remaining);
    };
    const halt = () => {
      clearTimeout(timer);
      remaining -= performance.now() - started;
    };
    const cancel = () => {
      clearTimeout(timer);
      onPause.delete(halt);
      onResume.delete(run);
      mount.signal.removeEventListener("abort", cancel);
    };
    const fire = () => {
      cancel();
      fn();
    };
    onPause.add(halt);
    onResume.add(run);
    mount.signal.addEventListener("abort", cancel);
    if (!paused) run();
    return cancel;
  };

  const wait = (ms) =>
    new Promise((resolve, reject) => {
      const signal = script.signal;
      if (signal.aborted) return reject(cancelled());
      const abort = () => {
        cancel();
        reject(cancelled());
      };
      const cancel = later(() => {
        signal.removeEventListener("abort", abort);
        resolve();
      }, ms);
      signal.addEventListener("abort", abort);
    });

  /** Runs a numeric tween that honours pause and script cancellation. */
  const tween = (duration, ease, onUpdate) =>
    new Promise((resolve, reject) => {
      const signal = script.signal;
      if (signal.aborted) return reject(cancelled());
      /* Reduced motion jumps straight to the end. Motion would defer even a
         zero-length tween's one update to the next frame, after `finished`
         has settled - so land it here, or a move resolves short of its
         target and its onMove listeners never hear where it ended. */
      if (reduced) {
        onUpdate(1);
        return resolve();
      }
      const controls = animate(0, 1, {
        duration,
        ease: ease,
        onUpdate,
      });
      const halt = () => controls.pause();
      const run = () => controls.play();
      const abort = () => {
        controls.stop();
        cleanup();
        reject(cancelled());
      };
      const cleanup = () => {
        onPause.delete(halt);
        onResume.delete(run);
        signal.removeEventListener("abort", abort);
      };
      onPause.add(halt);
      onResume.add(run);
      signal.addEventListener("abort", abort);
      if (paused) controls.pause();
      controls.finished.then(() => {
        cleanup();
        resolve();
      });
    });

  const local = (e) => {
    const r = root.getBoundingClientRect();
    return {
      // Layout size, not demo.width/height: a bleed artboard grows taller.
      x: (e.clientX - r.left) / (r.width / root.offsetWidth || 1),
      y: (e.clientY - r.top) / (r.height / root.offsetHeight || 1),
    };
  };

  const center = (el) => {
    const r = el.getBoundingClientRect();
    return local({ clientX: r.left + r.width / 2, clientY: r.top + r.height / 2 });
  };

  /* ---- the fake cursor ---- */
  const pointer = document.createElement("div");
  pointer.className = touch ? "demo-cursor is-touch" : "demo-cursor";
  if (!touch) pointer.innerHTML = CURSOR_SVG;
  if (autoplay) root.append(pointer);

  const pos = { x: demo.width * 0.72, y: demo.height * 0.82 };
  let pressed = false;
  const moveListeners = new Set();
  // Where the hotspot sits inside the drawing: the arrow's tip, the dot's centre.
  const tip = touch ? { x: 11, y: 11 } : { x: 2, y: 1.5 };
  const place = () => {
    /* In a card the cursor scales with the picture, like a screen recording
       (and so does the poster still, shot at 2× a card). Blown up on a
       stage it stays the size of a real one. */
    const k = (pressed ? (touch ? 0.8 : 0.86) : 1) / (live ? Math.max(1, scale) : 1);
    pointer.style.transform = `translate(${pos.x - tip.x}px, ${pos.y - tip.y}px) scale(${k})`;
    pointer.classList.toggle("is-pressed", pressed);
  };
  const paint = () => {
    place();
    moveListeners.forEach((fn) => fn({ x: pos.x, y: pos.y }));
  };

  /* Contain-fit the artboard into whatever box it was given, up to
     `maxScale`: centred, or for a `bleed` demo pinned to the top and grown
     down to the box's floor (see `Demo.bleed`).
     Layout size is what the observer sees, so a FLIP transform on an
     ancestor doesn't make the demo re-scale mid-flight.
     Its edges land on whole device pixels. Between two, the artboard's own
     background and a layer drawn over it are each smoothed on their own,
     and the first showed through as a hairline - a light line along a dark
     window. So the box is snapped: its size by a hair of non-uniform
     scale, its corner by a sub-pixel nudge measured against the frame. */
  const hang = demo.bleed === "bottom";
  root.style.left = root.style.top = "0";
  root.style.transformOrigin = "0 0";
  const fit = () => {
    const w = frame.clientWidth;
    const hgt = frame.clientHeight;
    if (!w || !hgt) return;
    scale = Math.min(w / demo.width, hgt / demo.height, maxScale * (demo.stretch ?? 1));
    const dpr = devicePixelRatio || 1;
    const snap = (v) => Math.round(v * dpr) / dpr;
    const bw = snap(demo.width * scale);
    const bh = snap(demo.height * scale);
    // Where the frame's padding box starts on screen, so the nudge lands the corner on the grid.
    const r = frame.getBoundingClientRect();
    const ox = r.left + frame.clientLeft;
    const oy = r.top + frame.clientTop;
    const x = snap(ox + (w - bw) / 2) - ox;
    const sy = bh / demo.height;
    const rest = hgt - (demo.reach ?? Infinity) * sy;
    const y = hang ? (rest > 0 ? snap(oy + rest / 2) - oy : 0) : snap(oy + (hgt - bh) / 2) - oy;
    // Grown in whole artboard px past the box's floor; the frame clips the rest.
    if (hang) root.style.height = `${Math.max(demo.height, Math.ceil((hgt - y) / sy))}px`;
    root.style.transform = `translate(${x}px, ${y}px) scale(${bw / demo.width}, ${sy})`;
    place();
  };
  const ro = new ResizeObserver(fit);
  ro.observe(frame);
  fit();

  /* ---- surface: the colour the page around the artboard should be ---- */
  let surface = null;
  const surfaceListeners = new Set();
  const frameBg = frame.style.backgroundColor;
  const setSurface = (color, tone) => {
    const next = color ? { color, tone: tone ?? demo.theme ?? "light" } : null;
    if (next?.color === surface?.color && next?.tone === surface?.tone) return;
    surface = next;
    // The frame's own letterbox follows too, wherever it's mounted.
    frame.style.backgroundColor = next ? next.color : frameBg;
    surfaceListeners.forEach((fn) => fn(next));
  };
  const resolve = (t) => ("x" in t ? t : center(t));

  const cursor = {
    get x() {
      return pos.x;
    },
    get y() {
      return pos.y;
    },
    show(at) {
      if (at) Object.assign(pos, resolve(at));
      paint();
      pointer.classList.add("is-visible");
    },
    hide() {
      pointer.classList.remove("is-visible");
    },
    async move(to, opts = {}) {
      const target = resolve(to);
      const end = { x: target.x + (opts.offset?.x ?? 0), y: target.y + (opts.offset?.y ?? 0) };
      const start = { ...pos };
      const dx = end.x - start.x;
      const dy = end.y - start.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 0.5) return;
      /* A hand doesn't travel in a ruler-straight line - bow the path a
         little to one side, proportional to the distance covered. */
      const bow = dist * 0.12;
      const ctrl = {
        x: start.x + dx / 2 - (dy / dist) * bow,
        y: start.y + dy / 2 + (dx / dist) * bow,
      };
      const duration = opts.duration ?? Math.min(0.95, Math.max(0.38, dist / 700));
      pointer.classList.add("is-visible");
      await tween(duration, [0.45, 0, 0.2, 1], (t) => {
        const u = 1 - t;
        pos.x = u * u * start.x + 2 * u * t * ctrl.x + t * t * end.x;
        pos.y = u * u * start.y + 2 * u * t * ctrl.y + t * t * end.y;
        paint();
      });
    },
    async press() {
      pressed = true;
      paint();
      await wait(90);
    },
    async release() {
      pressed = false;
      paint();
      await wait(60);
    },
    async click(fn) {
      await cursor.press();
      fn?.();
      await cursor.release();
    },
    onMove(fn) {
      moveListeners.add(fn);
      return () => moveListeners.delete(fn);
    },
  };

  const frameLoops = new Set();
  let rafId = 0;
  let last = 0;
  const tick = (t) => {
    const dt = Math.min(64, t - (last || t));
    last = t;
    frameLoops.forEach((fn) => fn(dt, t));
    rafId = requestAnimationFrame(tick);
  };
  const startFrames = () => {
    if (!rafId && frameLoops.size && !paused) {
      last = 0;
      rafId = requestAnimationFrame(tick);
    }
  };
  const stopFrames = () => {
    cancelAnimationFrame(rafId);
    rafId = 0;
  };
  onPause.add(stopFrames);
  onResume.add(startFrames);

  const ctx = {
    root,
    live,
    reduced,
    signal: mount.signal,
    wait,
    later,
    cursor,
    local,
    center,
    frame(fn) {
      frameLoops.add(fn);
      startFrames();
    },
    setSurface,
  };

  const instance = demo.setup(ctx) ?? {};
  if (autoplay) root.append(pointer); // keep the cursor above whatever setup built

  /* Focusable by script and by a click on its bare surface, but no extra
     tab stop - unless the demo made it one itself. */
  if (live && focus) {
    if (!root.hasAttribute("tabindex")) root.tabIndex = -1;
    root.focus({ preventScroll: true, focusVisible: false });
  }

  /* While the walkthrough plays, the demo's live regions - a transcript, a
     message's status, a reader's caption - would read the fake visitor's
     every step aloud. They're silenced for the script and given back the
     moment the demo is the visitor's. */
  const hushed = new Map();
  const hush = (on) => {
    if (on) {
      root.querySelectorAll("[aria-live], [role=status], [role=log], [role=alert], [role=timer], [role=marquee]").forEach((el) => {
        if (hushed.has(el)) return;
        hushed.set(el, el.getAttribute("aria-live"));
        el.setAttribute("aria-live", "off");
      });
    } else {
      hushed.forEach((was, el) => (was === null ? el.removeAttribute("aria-live") : el.setAttribute("aria-live", was)));
      hushed.clear();
    }
  };

  /* ---- script loop ---- */
  let state = "idle";
  const setState = (next) => {
    state = next;
    frame.dataset.demoState = next;
    if (live) hush(next === "script");
    listeners.forEach((fn) => fn(next));
  };

  /* wait()/tween() read the *current* controller when called, so a new run
     must not start until the old one has actually left its script - or a
     pass still awaiting something outside the kit would pick up the new
     signal and keep running alongside it. */
  let running = Promise.resolve();
  let pendingReplay = null;
  let destroyed = false;

  /* How far a real mouse has hovered since this run started - see the
     takeover below. */
  let travelled = 0;
  let prev = null;
  /* Whether hovering may take over at all. A replay is asked for with the
     mouse, which then moves off the button it pressed: that isn't reaching
     in. Hover waits until the mouse has rested a second, or has left the
     stage and come back. */
  let armed = true;
  let disarm = () => {};

  const loop = () => (running = run());

  const run = async () => {
    if (!instance.script) return;
    script = new AbortController();
    const signal = script.signal;
    /* Every run, a replay included, gets the full hover grace again. Left
       over, the travel that took the last one over would end this one on
       the first nudge, and a stale `prev` would add one big jump. */
    travelled = 0;
    prev = null;
    setState("script");
    cursor.show();
    while (!signal.aborted) {
      try {
        await instance.script(ctx);
        await wait(200);
      } catch (error) {
        if ((error)?.[CANCELLED] || signal.aborted) break;
        console.error(`[demo:${id}]`, error);
        break;
      }
      if (!signal.aborted) instance.reset?.();
    }
  };

  const stopScript = () => {
    script.abort();
    pressed = false;
    cursor.hide();
  };

  const replay = () => {
    stopScript();
    instance.reset?.();
    disarm();
    // Wait for the cancelled pass to unwind (bounded, in case it's stuck).
    // Only the latest request starts a run, however fast it's pressed.
    const token = (pendingReplay = {});
    Promise.race([running, new Promise((r) => setTimeout(r, 1000))]).then(() => {
      if (!destroyed && pendingReplay === token) {
        pendingReplay = null;
        loop();
      }
    });
  };

  /* On stage the walkthrough runs until the visitor reaches in. A stray
     mouse already resting over the stage when it opens shouldn't count, so
     hovering has to travel a little before it's a takeover; a press, a key
     or Tabbing onto a control always is.
     What they reach for is what they saw. A press, a touch, the wheel or a
     key stops the script and lets go of its fake press, and everything else
     stays as it is: the switch the walkthrough left on is still on, so the
     first tap turns it off. A mouse that merely wandered in has aimed at
     nothing, and gets the demo back at rest. */
  if (live) {
    /* A press is hit-tested against the picture from before the takeover.
       If the takeover moved things - a reset, or a demo's own hook - a press
       on a thing keeps it, even if it moved: that's what the visitor aimed
       at. A press on empty space, or on something taken away, goes to
       whatever is under the pointer now: the row that sprang back into the
       gap it was pressed in. */
    const retarget = (e) => {
      const was = e.target;
      const hit = document.elementFromPoint(e.clientX, e.clientY);
      if (!hit || hit === was || !root.contains(hit)) return;
      if (root.contains(was) && !was.contains(hit)) return;
      e.stopImmediatePropagation();
      hit.dispatchEvent(new PointerEvent(e.type, e));
    };
    /* A touch is hit-tested once, before its pointerover - which is already
       the takeover - so its pointerdown still carries the old target. */
    let stale = null;
    /* A thumb that lands on the stage on its way to scrolling the page is no
       visitor reaching in: the browser claims the gesture for panning and
       cancels the pointer. A cancel that soon after a touch takeover, with
       nothing else in between, gives the walkthrough back. */
    let touched = null;
    const takeover = (how, e) => {
      if (state !== "script") return;
      touched = e instanceof PointerEvent && e.pointerType !== "mouse" ? { id: e.pointerId, at: e.timeStamp } : null;
      stopScript();
      /* The walkthrough's pressed look goes with its hand. A real press puts
         its own back on: the demo's handlers see this event after this. */
      root.querySelectorAll(".is-pressed").forEach((el) => el.classList.remove("is-pressed"));
      let moved = true;
      if (instance.takeover) instance.takeover(how);
      else if (how === "hover") instance.reset?.();
      else moved = false;
      setState("live");
      if (moved && e instanceof PointerEvent && (e.type === "pointerdown" || e.pointerType !== "mouse")) stale = e.pointerId;
    };
    const capture = { signal: mount.signal, capture: true };
    frame.addEventListener(
      "pointerdown",
      (e) => {
        takeover("press", e);
        if (stale !== e.pointerId) return;
        stale = null;
        retarget(e);
      },
      capture,
    );
    frame.addEventListener(
      "pointercancel",
      (e) => {
        const t = touched;
        touched = null;
        if (t && t.id === e.pointerId && e.timeStamp - t.at < 400 && state === "live") replay();
      },
      capture,
    );
    // A lift, or anything else the visitor does, makes the takeover theirs for good.
    frame.addEventListener("pointerup", () => (touched = null), capture);
    frame.addEventListener("keydown", () => (touched = null), capture);
    // Tab only passes through: arriving on a control is the focusin below.
    frame.addEventListener("keydown", (e) => e.key !== "Tab" && takeover("press"), capture);
    // Scrolling inside the stage is reaching in too - don't fight a wheel.
    frame.addEventListener("wheel", (e) => takeover("press", e), { ...capture, passive: true });

    /* A keyboard reaches in by Tabbing onto a control - its keydown fired
       outside, so only the focus arrives here. That includes the artboard
       itself, for a demo that made it the tab stop. A script focusing its
       own field is no visitor, though, nor is a page focusing the artboard
       so keys reach it: only focus that lands on the heels of a Tab counts. */
    let tabbed = -Infinity;
    document.addEventListener("keydown", (e) => e.key === "Tab" && (tabbed = e.timeStamp), capture);
    frame.addEventListener("focusin", (e) => e.timeStamp - tabbed < 150 && takeover("press"), capture);

    /* After a replay, hover is held off until the mouse rests for a second
       (any move, anywhere, restarts the count) or leaves the stage. */
    let rest = 0;
    const settle = () => {
      clearTimeout(rest);
      rest = window.setTimeout(() => (armed = true), 1000);
    };
    disarm = () => {
      armed = false;
      settle();
    };
    document.addEventListener("pointermove", (e) => !armed && e.pointerType === "mouse" && settle(), capture);
    mount.signal.addEventListener("abort", () => clearTimeout(rest));

    /* Until then the script owns the demo, so real hover input is stopped
       here on its way down and the demo's own handlers never fight the fake
       cursor. Whatever tips it into a takeover is let through: the demo has
       run reset() (or its takeover()) by the time it sees that event. */
    for (const type of ["pointermove", "pointerover", "pointerout", "pointerenter", "pointerleave"]) {
      frame.addEventListener(
        type,
        (e) => {
          /* Leaving the stage breaks the trail - coming back in elsewhere
             isn't travel. Reset here rather than in a bubble listener, which
             the stopPropagation below would skip even on the frame itself. */
          if (type === "pointerleave" && e.target === frame) {
            prev = null;
            armed = true;
          }
          if (state !== "script") return;
          /* Touch and pen only hover the stage on their way to reaching in. Their
             leaving is no reach - it's the tail of a touch the page took for a
             scroll, arriving just after the walkthrough was given back. */
          if (e.pointerType !== "mouse") {
            if (type !== "pointerout" && type !== "pointerleave") return takeover("press", e);
          }
          // Held off, the trail starts over from wherever the mouse is once it isn't.
          else if (type === "pointermove" && !armed) prev = null;
          else if (type === "pointermove") {
            const p = { x: e.clientX, y: e.clientY };
            if (prev) travelled += Math.hypot(p.x - prev.x, p.y - prev.y);
            prev = p;
            if (travelled > 90) return takeover("hover", e);
          }
          e.stopPropagation();
        },
        capture,
      );
    }
    // Compatibility mouse events trail their pointer twins, which have already
    // decided on any takeover - while the script still owns it, they just stop.
    for (const type of ["mousemove", "mouseover", "mouseout", "mouseenter", "mouseleave"]) {
      frame.addEventListener(type, (e) => state === "script" && e.stopPropagation(), capture);
    }
  }

  if (autoplay && !reduced) loop();
  else setState(live ? "live" : "idle");

  return {
    get state() {
      return state;
    },
    pause() {
      if (paused) return;
      paused = true;
      root.classList.add("is-paused");
      onPause.forEach((fn) => fn());
      /* Freeze whatever is mid-flight too - WAAPI, CSS transitions, Motion's
         accelerated tweens. Only running ones, so resume never replays a
         finished animation. */
      frozen = root.getAnimations({ subtree: true }).filter((a) => a.playState === "running");
      frozen.forEach((a) => a.pause());
    },
    resume() {
      if (!paused) return;
      paused = false;
      root.classList.remove("is-paused");
      frozen.forEach((a) => a.playState === "paused" && a.play());
      frozen = [];
      onResume.forEach((fn) => fn());
    },
    replay,
    destroy() {
      destroyed = true;
      stopScript();
      mount.abort();
      stopFrames();
      frameLoops.clear();
      ro.disconnect();
      instance.destroy?.();
      root.remove();
    },
    onState(fn) {
      listeners.add(fn);
    },
    onSurface(fn) {
      surfaceListeners.add(fn);
      fn(surface);
    },
  };
}

/* ==================================================================
   Demo：angry-sliders（src/demos/angry-sliders.ts）
   ================================================================== */

/* A render-settings panel whose sliders are slingshots. Grab a knob and pull
   it off the track: two rubber bands stretch from the track to the knob, a
   dotted arc shows where it will land, and the value it would land on is
   read out at the landing tick and in the header. Let go and it snaps back
   through the fork and flies along that arc. Pull left to throw right, pull
   further to throw further; pulling straight down only throws it up. */

const W = 460;
const H = 470;
const PX = 50; // track's left end
const TW = 360; // track length
const ROW0 = 118; // first track's y
const GAP = 73;
const FORK = 6.5; // half the distance between the band's two posts
const STRETCH = 95; // the band's limit: the knob never gets further than this
const RANGE = 0.07; // landing offset per px² of (sideways pull × downward pull)
const LOFT = 0.0095; // arc height per px² of downward pull
const MIN_PULL = 15; // a shorter pull is a fumble, not a shot

const PARAMS = [
  {
    label: "曝光",
    min: -3,
    max: 3,
    step: 0.1,
    value: 0.4,
    fmt: (v) => `${v < 0 ? "−" : "+"}${Math.abs(v).toFixed(1)} EV`,
  },
  { label: "泛光", min: 0, max: 100, step: 1, value: 35, fmt: (v) => `${v}%` },
  { label: "视野", min: 20, max: 120, step: 1, value: 72, fmt: (v) => `${v}°` },
  { label: "采样", min: 1, max: 256, step: 1, value: 64, fmt: (v) => `${v}` },
];

const SVG = "http://www.w3.org/2000/svg";
const svg = (tag, attrs = {}) => {
  const el = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, String(v));
  return el;
};

const demo = defineDemo({
  width: W,
  height: H,
  background: "#18181c",
  theme: "dark",
  css: css`
    :scope {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      color: #e6e6eb;
      user-select: none;
      -webkit-user-select: none;
      --violet: #5a4eea;
      --violet-ink: #5b4fe8;
    }
    :scope .mono {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
    }
    :scope .row {
      position: absolute;
      left: ${PX}px;
      width: ${TW}px;
      height: 40px;
    }
    :scope .label {
      position: absolute;
      left: -6px;
      top: -4px;
      font-size: 12px;
      line-height: 16px;
      color: #8e8e93;
    }
    :scope .out {
      position: absolute;
      right: -6px;
      top: -4px;
      font-size: 12px;
      line-height: 16px;
      color: #e6e6eb;
      transition: color 160ms ease;
    }
    :scope .row.is-live .out {
      color: var(--violet-ink);
    }
    :scope .track {
      position: absolute;
      left: 0;
      right: 0;
      top: ${32 - 1}px;
      height: 2px;
      border-radius: 1px;
      background: #2c2c31;
    }
    :scope .fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 2px;
      border-radius: 1px;
      background: #e6e6eb;
      transition: opacity 260ms ease;
    }
    :scope .row.is-live .fill {
      opacity: 0.22;
      transition-duration: 120ms;
    }
    :scope svg {
      position: absolute;
      inset: 0;
      overflow: visible;
      pointer-events: none;
      z-index: 2;
    }
    /* The knob's hit area is 40px; the dot inside it is what you see. */
    :scope .knob {
      position: absolute;
      left: 0;
      top: 0;
      width: 40px;
      height: 40px;
      margin: -20px 0 0 -20px;
      z-index: 3;
      border-radius: 50%;
      cursor: grab;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }
    :scope .knob.is-up {
      z-index: 4;
    }
    :scope.is-grabbing,
    :scope.is-grabbing .knob {
      cursor: grabbing;
    }
    :scope .dot {
      position: absolute;
      left: 14px;
      top: 14px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #e8e7ee;
      box-shadow:
        inset 0 0 0 0 var(--violet),
        0 1px 3px rgb(0 0 0 / 0.5);
      transition:
        transform 160ms cubic-bezier(0.3, 1.4, 0.5, 1),
        background-color 140ms ease,
        box-shadow 160ms ease;
    }
    /* Held: bigger, solid violet. In the air and after landing: white, ringed. */
    :scope .knob.is-held .dot {
      transform: scale(1.3);
      background: var(--violet);
      box-shadow:
        inset 0 0 0 0 var(--violet),
        0 1px 3px rgb(0 0 0 / 0.5);
    }
    :scope .knob.is-ring .dot {
      box-shadow:
        inset 0 0 0 2.5px var(--violet),
        0 1px 3px rgb(0 0 0 / 0.5);
    }
    :scope .knob:focus-visible .dot {
      outline: 2px solid var(--violet-ink);
      outline-offset: 3px;
    }
    [data-demo-state="live"] :scope .knob:not(.is-held):hover .dot {
      transform: scale(1.15);
    }
    :scope .band {
      stroke: var(--violet);
      stroke-width: 1.5;
      stroke-linecap: round;
    }
    :scope .aim {
      stroke: #55555a;
      stroke-width: 2.6;
      stroke-linecap: round;
      stroke-dasharray: 0 8.5;
      fill: none;
    }
    :scope .arc {
      stroke: #55555a;
      stroke-width: 2.6;
      stroke-linecap: round;
      stroke-dasharray: 0 9.5;
      fill: none;
    }
    :scope .tick {
      stroke: var(--violet-ink);
      stroke-width: 1.5;
    }
    :scope .tag {
      fill: var(--violet-ink);
      font-size: 10px;
    }
    @media (prefers-reduced-motion: reduce) {
      :scope .dot,
      :scope .fill,
      :scope .out {
        transition: none;
      }
    }
  `,
  setup({ root, signal, cursor, wait, frame, local, reduced }) {
    const xOf = (r, v) => PX + ((v - r.min) / (r.max - r.min)) * TW;
    const snapV = (r, v) => {
      const n = Math.round((Math.min(r.max, Math.max(r.min, v)) - r.min) / r.step);
      return Number((r.min + n * r.step).toFixed(2));
    };
    const vOf = (r, x) => snapV(r, r.min + ((x - PX) / TW) * (r.max - r.min));

    /* ---- build ---- */
    const rows = PARAMS.map((p, i) => {
      const y = ROW0 + i * GAP;
      const out = h("span", { class: "out mono", "aria-hidden": "true" });
      const fill = h("span", { class: "fill" });
      const dot = h("span", { class: "dot" });
      const knob = h(
        "div",
        {
          class: "knob",
          role: "slider",
          tabindex: "0",
          "aria-label": p.label,
          "aria-valuemin": String(p.min),
          "aria-valuemax": String(p.max),
        },
        dot,
      );
      const el = h(
        "div",
        { class: "row" },
        h("span", { class: "label" }, p.label),
        out,
        h("span", { class: "track" }, fill),
      );
      el.style.top = `${y - 32}px`;
      root.append(el, knob);
      const x = xOf(p, p.value);
      return { ...p, i, y, rest: p.value, x, ky: y, vx: 0, vy: 0, el, knob, dot, fill, out };
    });

    const layer = svg("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, "aria-hidden": "true" });
    const arc = svg("path", { class: "arc" });
    const aim = svg("line", { class: "aim" });
    const bandL = svg("line", { class: "band" });
    const bandR = svg("line", { class: "band" });
    const tick = svg("line", { class: "tick" });
    const tag = svg("text", { class: "tag mono", "text-anchor": "middle" });
    layer.append(arc, aim, bandL, bandR, tick, tag);
    root.append(layer);

    const show = (el, on) => {
      el.style.display = on ? "" : "none";
    };

    const setOut = (r, v) => {
      r.out.textContent = r.fmt(v);
    };
    const commit = (r, v) => {
      r.value = v;
      setOut(r, v);
      r.knob.setAttribute("aria-valuenow", String(v));
      r.knob.setAttribute("aria-valuetext", r.fmt(v));
    };

    /* ---- the shot ---- */
    let shot = null;

    const fork = (r) => ({ x: xOf(r, r.value), y: r.y });

    /* The band gives less the further it goes: tanh caps the knob at STRETCH. */
    const stretch = (raw) => {
      const d = Math.hypot(raw.x, raw.y);
      if (d < 0.001) return { x: 0, y: 0 };
      const k = (STRETCH * Math.tanh(d / STRETCH)) / d;
      return { x: raw.x * k, y: raw.y * k };
    };

    /* Thrown back through the fork: sideways speed from the sideways pull,
       upward speed from the downward pull, so the landing offset goes with
       their product and the arc's height with the downward pull squared. */
    const predict = (s) => {
      const r = s.row;
      const x0 = fork(r).x;
      const down = Math.abs(s.pull.y);
      s.target = vOf(r, x0 - RANGE * s.pull.x * down);
      s.xL = xOf(r, s.target);
      s.arc = Math.max(6, LOFT * down * down);
    };

    const grab = (r, at) => {
      if (shot) finish();
      shot = { row: r, phase: "aim", start: at, pull: { x: 0, y: 0 }, target: r.value, xL: r.x, arc: 0, t: 0, from: at, dur: 0 };
      predict(shot);
      for (const o of rows) o.knob.classList.remove("is-ring", "is-up");
      r.knob.classList.add("is-held", "is-up");
      r.el.classList.add("is-live");
      root.classList.add("is-grabbing");
    };

    const aimAt = (p) => {
      if (!shot || shot.phase !== "aim") return;
      shot.pull = stretch({ x: p.x - shot.start.x, y: p.y - shot.start.y });
      predict(shot);
      setOut(shot.row, shot.target);
    };

    const letGo = () => {
      root.classList.remove("is-grabbing");
      if (!shot || shot.phase !== "aim") return;
      const s = shot;
      s.row.knob.classList.remove("is-held");
      const fumble = Math.hypot(s.pull.x, s.pull.y) < MIN_PULL || s.target === s.row.value;
      if (fumble) return cancel();
      s.row.knob.classList.add("is-ring");
      if (reduced) return land();
      const f = fork(s.row);
      s.from = { x: f.x + s.pull.x, y: f.y + s.pull.y };
      s.phase = "snap";
      s.t = 0;
      s.dur = 0.24 + Math.abs(s.xL - f.x) / 1100 + s.arc / 500;
    };

    /* Not a shot: the band pulls the knob home with a little wobble. */
    const cancel = () => {
      if (!shot) return;
      const r = shot.row;
      r.knob.classList.remove("is-held");
      r.el.classList.remove("is-live");
      root.classList.remove("is-grabbing");
      setOut(r, r.value);
      const f = fork(r);
      r.x = f.x + shot.pull.x;
      r.ky = f.y + shot.pull.y;
      r.vx = r.vy = 0;
      shot = null;
      if (reduced) {
        r.x = f.x;
        r.ky = f.y;
      }
    };

    const land = () => {
      if (!shot) return;
      const r = shot.row;
      commit(r, shot.target);
      r.x = shot.xL;
      r.ky = r.y;
      r.vx = r.vy = 0;
      r.knob.classList.remove("is-held");
      r.el.classList.remove("is-live");
      shot = null;
      if (!reduced) {
        r.dot.animate([{ transform: "scale(1.45, 0.7)" }, { transform: "scale(1)" }], {
          duration: 320,
          easing: "cubic-bezier(0.3, 1.5, 0.5, 1)",
        });
      }
    };

    /* A shot still in the air when another knob is grabbed lands at once. */
    const finish = () => {
      if (!shot) return;
      if (shot.phase === "aim") cancel();
      else land();
    };

    /* ---- drawing ---- */
    const easeIn = (k) => k * k;
    let recoil = 0; // seconds since the band let go, for its twang

    frame((ms) => {
      const dt = Math.min(ms, 50) / 1000;

      if (shot && shot.phase === "snap") {
        shot.t += dt;
        if (shot.t >= 0.07) {
          shot.phase = "fly";
          shot.t = 0;
          recoil = 0;
        }
      } else if (shot && shot.phase === "fly") {
        shot.t += dt;
        recoil += dt;
        if (shot.t >= shot.dur) land();
      }

      for (const r of rows) {
        const isShot = shot?.row === r;
        let x;
        let y;
        if (isShot && shot) {
          const f = fork(r);
          if (shot.phase === "aim") {
            x = f.x + shot.pull.x;
            y = f.y + shot.pull.y;
          } else if (shot.phase === "snap") {
            const k = easeIn(Math.min(1, shot.t / 0.07));
            x = shot.from.x + (f.x - shot.from.x) * k;
            y = shot.from.y + (f.y - shot.from.y) * k;
          } else {
            const s = Math.min(1, shot.t / shot.dur);
            x = f.x + (shot.xL - f.x) * s;
            y = f.y - 4 * shot.arc * s * (1 - s);
          }
          r.x = x;
          r.ky = y;
        } else {
          // Home on a spring: a cancelled pull wobbles back, a key nudge glides.
          const tx = xOf(r, r.value);
          for (let left = dt; left > 0; left -= 1 / 240) {
            const step = Math.min(left, 1 / 240);
            r.vx += (-520 * (r.x - tx) - 2 * 0.42 * Math.sqrt(520) * r.vx) * step;
            r.vy += (-520 * (r.ky - r.y) - 2 * 0.42 * Math.sqrt(520) * r.vy) * step;
            r.x += r.vx * step;
            r.ky += r.vy * step;
          }
          if (Math.abs(r.x - tx) < 0.05 && Math.abs(r.vx) < 1) {
            r.x = tx;
            r.vx = 0;
          }
          if (Math.abs(r.ky - r.y) < 0.05 && Math.abs(r.vy) < 1) {
            r.ky = r.y;
            r.vy = 0;
          }
          x = r.x;
          y = r.ky;
        }
        r.knob.style.transform = `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px)`;
        // The fill keeps the old value, dimmed, until the knob lands.
        const fx = isShot ? xOf(r, r.value) : Math.max(PX, Math.min(PX + TW, x));
        r.fill.style.width = `${(fx - PX).toFixed(2)}px`;
      }

      paintShot();
    });

    const paintShot = () => {
      const s = shot;
      const aiming = !!s && s.phase === "aim";
      show(arc, aiming && s.xL !== fork(s.row).x);
      show(aim, aiming);
      show(tick, aiming);
      show(tag, aiming);
      if (!s) {
        show(bandL, false);
        show(bandR, false);
        return;
      }
      const r = s.row;
      const f = fork(r);
      // The bands hold the knob until it passes the fork, then twang.
      let tip = { x: r.x, y: r.ky };
      if (s.phase === "fly") {
        const len = Math.hypot(s.pull.x, s.pull.y) || 1;
        const a = 0.45 * len * Math.exp(-recoil / 0.05) * Math.cos(recoil * 70);
        tip = { x: f.x - (s.pull.x / len) * a, y: f.y - (s.pull.y / len) * a };
      }
      const twang = s.phase !== "fly" || recoil < 0.2;
      show(bandL, twang);
      show(bandR, twang);
      for (const [band, dx] of [
        [bandL, -FORK],
        [bandR, FORK],
      ]) {
        band.setAttribute("x1", (f.x + dx).toFixed(2));
        band.setAttribute("y1", String(f.y));
        band.setAttribute("x2", tip.x.toFixed(2));
        band.setAttribute("y2", tip.y.toFixed(2));
      }
      if (!aiming) return;
      aim.setAttribute("x1", r.x.toFixed(2));
      aim.setAttribute("y1", r.ky.toFixed(2));
      aim.setAttribute("x2", f.x.toFixed(2));
      aim.setAttribute("y2", String(f.y));
      // A parabola from the fork to the landing point is a quadratic Bézier
      // whose control point sits at twice the arc's height.
      const mx = (f.x + s.xL) / 2;
      arc.setAttribute("d", `M${f.x.toFixed(2)} ${f.y}Q${mx.toFixed(2)} ${(f.y - 2 * s.arc).toFixed(2)} ${s.xL.toFixed(2)} ${f.y}`);
      tick.setAttribute("x1", s.xL.toFixed(2));
      tick.setAttribute("x2", s.xL.toFixed(2));
      tick.setAttribute("y1", String(f.y - 6));
      tick.setAttribute("y2", String(f.y + 6));
      tag.setAttribute("x", Math.max(PX + 14, Math.min(PX + TW - 14, s.xL)).toFixed(2));
      tag.setAttribute("y", String(f.y - 13));
      tag.textContent = r.fmt(s.target);
    };

    /* ---- input ---- */
    for (const r of rows) {
      r.knob.addEventListener(
        "pointerdown",
        (e) => {
          if (e.button !== 0) return;
          r.knob.setPointerCapture(e.pointerId);
          grab(r, local(e));
        },
        { signal },
      );
      r.knob.addEventListener(
        "pointermove",
        (e) => {
          if (r.knob.hasPointerCapture(e.pointerId)) aimAt(local(e));
        },
        { signal },
      );
      r.knob.addEventListener("pointerup", () => shot?.row === r && letGo(), { signal });
      r.knob.addEventListener(
        "pointercancel",
        () => {
          if (shot?.row === r && shot.phase === "aim") cancel();
          root.classList.remove("is-grabbing");
        },
        { signal },
      );
      /* Keys work it like any slider: arrows step, Page keys and Shift step
         ten, Home/End go to the ends. Escape drops a pull. */
      r.knob.addEventListener(
        "keydown",
        (e) => {
          if (e.key === "Escape" && shot?.row === r && shot.phase === "aim") {
            e.preventDefault();
            cancel();
            return;
          }
          const big = e.shiftKey ? 10 : 1;
          const steps = {
            ArrowRight: big,
            ArrowUp: big,
            ArrowLeft: -big,
            ArrowDown: -big,
            PageUp: 10,
            PageDown: -10,
          };
          let next = null;
          if (e.key in steps) next = snapV(r, r.value + steps[e.key] * r.step);
          else if (e.key === "Home") next = r.min;
          else if (e.key === "End") next = r.max;
          if (next === null) return;
          e.preventDefault();
          e.stopPropagation();
          if (shot?.row === r) return;
          for (const o of rows) o.knob.classList.remove("is-ring");
          commit(r, next);
          if (reduced) r.x = xOf(r, next);
        },
        { signal },
      );
    }

    for (const r of rows) commit(r, r.value);

    /* ---- walkthrough ---- */
    let scripted = false;
    const off = cursor.onMove((p) => scripted && aimAt(p));
    signal.addEventListener("abort", () => off());

    /* The hand offset that leaves the knob pulled so it lands on `value`,
       with `down` px of downward pull: undo the band's tanh. */
    const handFor = (r, value, down) => {
      const side = -(xOf(r, value) - xOf(r, r.value)) / (RANGE * down);
      const d = Math.hypot(side, down);
      const k = (STRETCH * Math.atanh(Math.min(0.97, d / STRETCH))) / d;
      return { x: side * k, y: down * k };
    };

    /* Grab, swing the aim through a few landing points, let go, watch. */
    const throwIt = async (r, aims) => {
      await cursor.move({ x: r.x, y: r.y + 2 }, { duration: 0.6 });
      await wait(160);
      await cursor.press();
      const start = { x: cursor.x, y: cursor.y };
      grab(r, start);
      scripted = true;
      for (const [value, down, dur, hold] of aims) {
        const o = handFor(r, value, down);
        await cursor.move({ x: start.x + o.x, y: start.y + o.y }, { duration: dur });
        await wait(hold);
      }
      scripted = false;
      letGo();
      await cursor.release();
    };

    const PARK = { x: 110, y: 440 };

    const reset = () => {
      scripted = false;
      shot = null;
      root.classList.remove("is-grabbing");
      for (const r of rows) {
        commit(r, r.rest);
        r.x = xOf(r, r.rest);
        r.ky = r.y;
        r.vx = r.vy = 0;
        r.knob.classList.remove("is-held", "is-ring", "is-up");
        r.el.classList.remove("is-live");
      }
      paintShot();
    };

    return {
      async script() {
        cursor.show(PARK);
        await wait(500);
        // The original's order: view, bloom, exposure (thrown left), samples.
        await throwIt(rows[2], [
          [88, 46, 0.5, 300],
          [103, 54, 0.45, 650],
        ]);
        await wait(1000);
        await throwIt(rows[1], [
          [19, 56, 0.5, 450],
          [68, 62, 0.7, 450],
        ]);
        await wait(900);
        await throwIt(rows[0], [
          [-2.7, 52, 0.45, 250],
          [-2.8, 58, 0.35, 500],
        ]);
        await wait(1100);
        await throwIt(rows[3], [
          [132, 52, 0.45, 300],
          [217, 62, 0.6, 450],
          [236, 64, 0.5, 450],
          [242, 66, 0.4, 500],
        ]);
        await wait(900);
        await cursor.move(PARK);
        await wait(1800);
      },
      reset,
      /* A press keeps every value where the walkthrough left it; a pull the
         walkthrough was holding is dropped back onto its track, and a knob
         already in the air finishes its flight. */
      takeover(how) {
        scripted = false;
        if (how === "hover") return reset();
        if (shot?.phase === "aim") cancel();
      },
    };
  },
});

/* ==================================================================
   挂载：画板按原尺寸放进 #demo，直接交给你操作，不跑演示脚本。
   ================================================================== */

{
  const host = document.getElementById("demo");
  // 底边裁在内容中间的 Demo（bleed）占满整个窗口：画板贴顶、向下长到窗口底边，和站点全屏试玩一样放大到 1.5 倍。
  const bleed = demo.bleed === "bottom";
  if (bleed) document.body.classList.add("bleed");
  else {
    host.style.aspectRatio = `${demo.width} / ${demo.height}`;
    // 也按窗口高度收窄：矮窗口里整个画板缩小放下，而不是顶部被裁出窗口外。
    host.style.maxWidth = `min(${demo.width}px, calc((100dvh - 32px) * ${demo.width} / ${demo.height}))`;
  }
  const background = demo.background ?? (demo.theme === "dark" ? "#111" : "#fff");
  const controller = mountDemo(host, "angry-sliders", demo, { live: true, autoplay: false, maxScale: bleed ? 1.5 : 1, focus: true });
  // 渐变底色已经铺满整页；画板里再画一遍会在画板边缘留下一道硬边。
  const artboard = host.querySelector(".demo-artboard");
  if (artboard && background.includes("gradient(")) artboard.style.background = "none";
  // 有的 Demo 会改自己的底色（比如切到暗色），页面跟着变。
  controller.onSurface((surface) => (document.body.style.background = surface?.color ?? background));
}
</script>
