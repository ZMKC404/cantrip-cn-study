<li>Only one group of sibling options opens at a time, so even a deep tree never turns into an ever-longer indented list.</li>
<li>Parents stay above, their text turns grey and a return arrow appears. The way you came is visible, and you can go straight back to any level.</li>
<li>The row you tap moves up to become an ancestor, the other rows fade out at an offset, and the new level joins in from the side, so it’s easy to follow what came before what.</li>
<li>The working area re-centers as the levels change, so your eye stays on what you can pick now instead of chasing the list downward.</li>
</ul>
