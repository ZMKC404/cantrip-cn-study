"btn t-press" type="button" data-copy-code="/code/angry-sliders" data-gate="code" data-astro-cid-axuhkfem><svg width="1em" height="1em" viewBox="0 0 256 256" data-astro-cid-axuhkfem="true" data-icon="ph:code-bold"><path fill="currentColor" d="M71.68 97.22L34.74 128l36.94 30.78a12 12 0 1 1-15.36 18.44l-48-40a12 12 0 0 1 0-18.44l48-40a12 12 0 0 1 15.36 18.44m176 21.56l-48-40a12 12 0 1 0-15.36 18.44L221.26 128l-36.94 30.78a12 12 0 1 0 15.36 18.44l48-40a12 12 0 0 0 0-18.44M164.1 28.72a12 12 0 0 0-15.38 7.18l-64 176a12 12 0 0 0 7.18 15.37a11.8 11.8 0 0 0 4.1.73a12 12 0 0 0 11.28-7.9l64-176a12 12 0 0 0-7.18-15.38"/></svg>Copy code</button><a class="btn t-press" href="/code/angry-sliders" download="angry-sliders.html" data-gate="code" data-astro-cid-axuhkfem><svg width="1em" height="1em" viewBox="0 0 256 256" data-astro-cid-axuhkfem="true" data-icon="ph:download-simple-bold"><path fill="currentColor" d="M228 144v64a12 12 0 0 1-12 12H40a12 12 0 0 1-12-12v-64a12 12 0 0 1 24 0v52h152v-52a12 12 0 0 1 24 0m-108.49 8.49a12 12 0 0 0 17 0l40-40a12 12 0 0 0-17-17L140 115V32a12 12 0 0 0-24 0v83L96.49 95.51a12 12 0 0 0-17 17Z"/></svg>Download HTML</a></div></div><dl class="meta" data-astro-cid-axuhkfem><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>Style</dt><dd data-astro-cid-axuhkfem>Playful, Technical</dd></div><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>Tone</dt><dd data-astro-cid-axuhkfem>Dark</dd></div><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>Built with</dt><dd data-astro-cid-axuhkfem>JavaScript, SVG, CSS</dd></div></dl></div><section class="notes" data-astro-cid-axuhkfem><h3 data-astro-cid-axuhkfem>Design notes</h3><div data-astro-cid-axuhkfem><ul>
<li>Dragging becomes aiming: pull the opposite way, and the farther you pull, the farther it flies. The landing spot is drawn before you let go and the value is written in the title row first, so every shot can be aimed before you fire.</li>
<li>The band has a limit: the pull goes through a <code>tanh</code>, so it gets harder the farther you go and tops out at <code>95px</code>. Your finger can travel far, but the slider always stays near the panel.</li>
<li>The landing spot comes from the product of the horizontal and vertical pull, and the arc height depends only on the vertical pull. So pulling straight down just hops in place, and pulling at an angle is what sends it far, as with a real slingshot.</li>
<li>Arrow keys, Page keys and Home/End adjust the value as usual, and Esc abandons the pull. A pull that’s too short doesn’t fire; the band wobbles the slider back to where it was.</li>
</ul>
</div></section></div></div><div data-part="stage"><div class="slides" data-astro-cid-axuhkfem><figure class="slide" data-slide="0" style="--r:0.9787234042553191;--mw:782px;--mwt:575px" data-theme="dark" data-astro-cid-axuhkfem><div class="m m-demo" data-demo="angry-sliders" data-demo-live data-theme="dark" style="background:#18181c" data-astro-cid-kg7vladn><img class="m-poster" src="/posters/angry-sliders.webp" width="460" height="470" alt="" loading="eager" decoding="async" draggable="false" data-poster data-astro-cid-kg7vladn></div></figure></div><div class="stage-chrome" data-stage-chrome aria-hidden="true" data-astro-cid-axuhkfem></div></div></template></body></html>
