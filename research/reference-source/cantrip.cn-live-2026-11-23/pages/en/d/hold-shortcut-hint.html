<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><link rel="stylesheet" href="/_astro/feed.i3oLm75g.css"><link rel="stylesheet" href="/_astro/DetailBody.CIetCpo6.css"></head><body><template data-detail-tpl="hold-shortcut-hint" data-at="82"><div data-part="info"><div class="info" data-astro-cid-axuhkfem><div class="lead" data-astro-cid-axuhkfem><p class="labels" data-astro-cid-axuhkfem><a href="/en?c=micro" data-filter="c:micro" data-astro-cid-axuhkfem>Micro &amp; Motion</a><a href="/en?t=keyboard" data-filter="t:keyboard" data-astro-cid-axuhkfem>Keyboard</a></p><h2 id="detail-title" data-astro-cid-axuhkfem>Hold-to-Peek Shortcuts</h2><p class="desc" data-astro-cid-axuhkfem>When you can&#39;t remember a shortcut, hold ⌘ for a moment and each row shows its shortcut at the end. A quick ⌘C is over before that, so the hints never flash.</p><p class="byline" data-astro-cid-axuhkfem><a href="https://detail.design/detail/hold-to-reveal-shortcut-hint" target="_blank" rel="noreferrer" data-astro-cid-axuhkfem>Original by Rene Wang<svg width="1em" height="1em" viewBox="0 0 256 256" data-astro-cid-axuhkfem="true" data-icon="ph:arrow-up-right-bold"><path fill="currentColor" d="M204 64v104a12 12 0 0 1-24 0V93L72.49 200.49a12 12 0 0 1-17-17L163 76H88a12 12 0 0 1 0-24h104a12 12 0 0 1 12 12"/></svg></a><span class="sep" aria-hidden="true" data-astro-cid-axuhkfem>·</span><time datetime="2026-10-18" data-astro-cid-axuhkfem>Oct 18, 2026</time></p></div><div class="side" data-astro-cid-axuhkfem><div class="actions" data-astro-cid-axuhkfem><button class="btn primary t-press" type="button" data-copy-prompt="Help me build &quot;Hold-to-Peek Shortcuts&quot; in my project: When you can't remember a shortcut, hold ⌘ for a moment and each row shows its shortcut at the end. A quick ⌘C is over before that, so the hints never flash.

ton class="btn t-press" type="button" data-copy-code="/code/hold-shortcut-hint" data-gate="code" data-astro-cid-axuhkfem><svg width="1em" height="1em" viewBox="0 0 256 256" data-astro-cid-axuhkfem="true" data-icon="ph:code-bold"><path fill="currentColor" d="M71.68 97.22L34.74 128l36.94 30.78a12 12 0 1 1-15.36 18.44l-48-40a12 12 0 0 1 0-18.44l48-40a12 12 0 0 1 15.36 18.44m176 21.56l-48-40a12 12 0 1 0-15.36 18.44L221.26 128l-36.94 30.78a12 12 0 1 0 15.36 18.44l48-40a12 12 0 0 0 0-18.44M164.1 28.72a12 12 0 0 0-15.38 7.18l-64 176a12 12 0 0 0 7.18 15.37a11.8 11.8 0 0 0 4.1.73a12 12 0 0 0 11.28-7.9l64-176a12 12 0 0 0-7.18-15.38"/></svg>Copy code</button><a class="btn t-press" href="/code/hold-shortcut-hint" download="hold-shortcut-hint.html" data-gate="code" data-astro-cid-axuhkfem><svg width="1em" height="1em" viewBox="0 0 256 256" data-astro-cid-axuhkfem="true" data-icon="ph:download-simple-bold"><path fill="currentColor" d="M228 144v64a12 12 0 0 1-12 12H40a12 12 0 0 1-12-12v-64a12 12 0 0 1 24 0v52h152v-52a12 12 0 0 1 24 0m-108.49 8.49a12 12 0 0 0 17 0l40-40a12 12 0 0 0-17-17L140 115V32a12 12 0 0 0-24 0v83L96.49 95.51a12 12 0 0 0-17 17Z"/></svg>Download HTML</a></div></div><dl class="meta" data-astro-cid-axuhkfem><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>Style</dt><dd data-astro-cid-axuhkfem>Minimal, Technical</dd></div><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>Tone</dt><dd data-astro-cid-axuhkfem>Dark</dd></div><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>Built with</dt><dd data-astro-cid-axuhkfem>CSS, JavaScript</dd></div></dl></div><section class="notes" data-astro-cid-axuhkfem><h3 data-astro-cid-axuhkfem>Design notes</h3><div data-astro-cid-axuhkfem><ul>
<li>After ⌘ goes down, the hints wait <code>600ms</code> before showing. Everyday ⌘C and ⌘S are long finished by then, so the whole column of hints doesn’t flicker. Pressing any other key in that window cancels it too: that’s a shortcut, not a request to see the hints.</li>
<li>They arrive fast and leave faster: the hints fade in top to bottom, staggered, and on release they vanish together with no stagger.</li>
<li>Each hint replaces the end of its row in place. The unread dot shrinks and fades, the fade mask on the right of the title makes room, and a long title softly fades into the badge instead of being cut off mid-letter.</li>
<li>While held, ⌘1–⌘9 select the matching row, and it all folds away the moment focus leaves. On non-Mac platforms it switches to Ctrl automatically.</li>
</ul>
</div></section></div></div><div data-part="stage"><div class="slides" data-astro-cid-axuhkfem><figure class="slide" data-slide="0" style="--r:1.0552763819095476;--mw:714px;--mwt:525px" data-theme="dark" data-astro-cid-axuhkfem><div class="m m-demo" data-demo="hold-shortcut-hint" data-demo-live data-theme="dark" style="background:#101010" data-astro-cid-kg7vladn><img class="m-poster" src="/posters/hold-shortcut-hint.webp" width="420" height="398" alt="" loading="eager" decoding="async" draggable="false" data-poster data-astro-cid-kg7vladn></div></figure></div><div class="stage-chrome" data-stage-chrome aria-hidden="true" data-astro-cid-axuhkfem></div></div></template></body></html>
