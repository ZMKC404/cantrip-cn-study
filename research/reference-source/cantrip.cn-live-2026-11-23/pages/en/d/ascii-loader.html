tn t-press" type="button" data-copy-code="/code/ascii-loader" data-gate="code" data-astro-cid-axuhkfem><svg width="1em" height="1em" viewBox="0 0 256 256" data-astro-cid-axuhkfem="true" data-icon="ph:code-bold"><path fill="currentColor" d="M71.68 97.22L34.74 128l36.94 30.78a12 12 0 1 1-15.36 18.44l-48-40a12 12 0 0 1 0-18.44l48-40a12 12 0 0 1 15.36 18.44m176 21.56l-48-40a12 12 0 1 0-15.36 18.44L221.26 128l-36.94 30.78a12 12 0 1 0 15.36 18.44l48-40a12 12 0 0 0 0-18.44M164.1 28.72a12 12 0 0 0-15.38 7.18l-64 176a12 12 0 0 0 7.18 15.37a11.8 11.8 0 0 0 4.1.73a12 12 0 0 0 11.28-7.9l64-176a12 12 0 0 0-7.18-15.38"/></svg>Copy code</button><a class="btn t-press" href="/code/ascii-loader" download="ascii-loader.html" data-gate="code" data-astro-cid-axuhkfem><svg width="1em" height="1em" viewBox="0 0 256 256" data-astro-cid-axuhkfem="true" data-icon="ph:download-simple-bold"><path fill="currentColor" d="M228 144v64a12 12 0 0 1-12 12H40a12 12 0 0 1-12-12v-64a12 12 0 0 1 24 0v52h152v-52a12 12 0 0 1 24 0m-108.49 8.49a12 12 0 0 0 17 0l40-40a12 12 0 0 0-17-17L140 115V32a12 12 0 0 0-24 0v83L96.49 95.51a12 12 0 0 0-17 17Z"/></svg>Download HTML</a></div></div><dl class="meta" data-astro-cid-axuhkfem><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>Style</dt><dd data-astro-cid-axuhkfem>Technical, Editorial</dd></div><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>Tone</dt><dd data-astro-cid-axuhkfem>Dark</dd></div><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>Built with</dt><dd data-astro-cid-axuhkfem>Canvas, JavaScript</dd></div></dl></div><section class="notes" data-astro-cid-axuhkfem><h3 data-astro-cid-axuhkfem>Design notes</h3><div data-astro-cid-axuhkfem><ul>
<li>The wait itself shows the content: the picture is built from characters, the subject first and the dotted background filling in after. It keeps growing for those few seconds, and the noise never drowns out the subject.</li>
<li>The handoff happens when the real image has loaded, not after a fixed time. It’s quick: one crossfade and the photo is there.</li>
<li>Once loaded, the character layer stays and shows only through a round lens that follows the pointer: the image underneath fades toward the paper color first, then the characters are printed on in the colors of their own pixels. Click the image to load it again.</li>
<li>The canvas is drawn at <code>devicePixelRatio</code>, so the characters stay sharp when zoomed in. On touch screens, a long press then a drag opens the same lens, and vertical swipes still scroll the page.</li>
<li>The sample photos are all CC0: the jacket is “Windbreaker Jacket, Hood Outside Transparency” by Ingolfson, the portrait is “Man with ripped jeans sitting” by Seth Doyle, both from Wikimedia Commons, cropped and turned black and white.</li>
</ul>
