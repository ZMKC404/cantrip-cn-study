<li>One ribbon ties the four cards into a single picture. It comes out from under the icon, loops once around the leaf shape in the illustration, draws a big circle on the bottom card, then slips under the window on the product card. The ribbon is the same white as the page, so it vanishes as it crosses the gaps and reads as weaving in and out between the cards.</li>
<li>Each card’s illustration does one small thing tied to its title, and stops there: the product windows shift apart, the icon is redrawn by its construction lines, the illustration’s curve traces itself again, the design-system swatches line up in a row.</li>
<li>Only one card lights up at a time. On hover or focus a card lifts slightly; the movement uses a curve with a gentle overshoot, and the line drawing uses a curve that settles smoothly.</li>
<li>The construction lines and the ribbon are both normalized with <code>pathLength=1</code>, so a stroke offset going from 1 to 0 means fully drawn, and lines of different lengths share one timing.</li>
</ul>
</div></section></div></div><div data-part="stage"><div class="slides" data-astro-cid-axuhkfem><figure class="slide" data-slide="0" style="--r:0.8260869565217391;--mw:646px;--mwt:475px" data-theme="light" data-astro-cid-axuhkfem><div class="m m-demo" data-demo="bento-cards" data-demo-live data-theme="light" style="background:#fdfdfd" data-astro-cid-kg7vladn><img class="m-poster" src="/posters/bento-cards.webp" width="380" height="460" alt="" loading="eager" decoding="async" draggable="false" data-poster data-astro-cid-kg7vladn></div></figure></div><div class="stage-chrome" data-stage-chrome aria-hidden="true" data-astro-cid-axuhkfem></div></div></template></body></html>
