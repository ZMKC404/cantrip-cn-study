cid-axuhkfem>Minimal</dd></div><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>Tone</dt><dd data-astro-cid-axuhkfem>Dark</dd></div></dl></div><section class="notes" data-astro-cid-axuhkfem><h3 data-astro-cid-axuhkfem>Design notes</h3><div data-astro-cid-axuhkfem><p>The usual toolbar gives every button its own tooltip, so moving from one to the next means one goes out and another comes on. John does it the other way round: the six tool names and their shortcuts sit side by side on one strip, and the tooltip is a window cut onto that strip. Hover a button and the window glides over it and takes the width of its name, while the strip slides inside the window, the old name leaving one side as the new one enters the other. The words are not swapped; they are carried past. It is the same thinking as the digits rolling to their new value like an odometer in the <a href="/en/i/price-ticker">Per-Seat Price Stepper</a>, or new content sliding in from the side you are heading towards in the <a href="/en/i/tab-clip">Clipped Pill Tabs</a>: when a change has somewhere it came from and a direction, the eye can keep up.</p>
<p>A few details make it read as one movement. The window’s position, its width and the strip all move on the same spring, with no bounce. When they move fast the words blur slightly (1px at most), like film running too quickly. The gap between buttons has a 90ms grace, so crossing from one to the next never makes the tip blink out. And on its first appearance it fades in where it is instead of flying in from somewhere else. The light grey circle under the hovered button follows the window’s centre too.</p>
<p>Tabbing onto a button with the keyboard shows the tip as well, and on a phone a tap shows it for a moment. On Kit the component is free, and both the code and the prompt can be copied.</p>
