<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><link rel="stylesheet" href="/_astro/feed.i3oLm75g.css"><link rel="stylesheet" href="/_astro/DetailBody.CIetCpo6.css"></head><body><template data-detail-tpl="input-16px-line" data-at="10"><div data-part="info"><div class="info" data-astro-cid-axuhkfem><div class="lead" data-astro-cid-axuhkfem><p class="labels" data-astro-cid-axuhkfem><a href="/en?c=principle" data-filter="c:principle" data-astro-cid-axuhkfem>Design Principles</a><a href="/en?t=click" data-filter="t:click" data-astro-cid-axuhkfem>Click</a><a href="/en?t=type" data-filter="t:type" data-astro-cid-axuhkfem>Typing</a></p><h2 id="detail-title" data-astro-cid-axuhkfem>The 16px Line</h2><p class="desc" data-astro-cid-axuhkfem>Adheeb staged an old rule as two phones: 14px on the left, and one tap pulls the page in; 16px on the right, and nothing moves.</p><p class="byline" data-astro-cid-axuhkfem><a href="https://x.com/AdheebHameed/status/2120153542094962869" target="_blank" rel="noreferrer" data-astro-cid-axuhkfem>By Adheeb<svg width="1em" height="1em" viewBox="0 0 256 256" data-astro-cid-axuhkfem="true" data-icon="ph:arrow-up-right-bold"><path fill="currentColor" d="M204 64v104a12 12 0 0 1-24 0V93L72.49 200.49a12 12 0 0 1-17-17L163 76H88a12 12 0 0 1 0-24h104a12 12 0 0 1 12 12"/></svg></a><span class="sep" aria-hidden="true" data-astro-cid-axuhkfem>·</span><time datetime="2026-11-14" data-astro-cid-axuhkfem>Nov 14, 2026</time></p></div><div class="side" data-astro-cid-axuhkfem><div class="actions single" data-astro-cid-axuhkfem><button class="btn primary t-press" type="button" data-copy-prompt="Help me apply &quot;The 16px Line&quot;, a rule for building interfaces, to my project.

The rule: Safari on iPhone zooms the whole page in when you tap an input whose text is smaller than 16px, and people have to zoom back out and keep finding their place in the form.
Where to look: every input, textarea and select, plus the input components of the UI library (search boxes, code fields, chat inputs); watch for sizes like 14px, 0.875rem or text-sm, and for fields shrunk by a parent or a transform.
What to change: at phone sizes, make the text typed into these controls at least 16px (1rem when the root size is 16px); desktop can keep its size. Labels and helper text can stay small; the typed text can't.
Don't: add maximum-scale=1 or user-scalable=no to the viewport to block it; that gets in the way of people who need to zoom.
How to check: on an iPhone or the iOS Simulator, tap every input; the page shouldn't zoom in.

First find every place in my code it applies to, and list what you would change and how. Wait for my go-ahead before editing; when you're done, tell me how to check it.

Source: Adheeb's explainer, https://x.com/AdheebHameed/status/2120153542094962869
See it here: https://cantrip.cn/en/i/input-16px-line
The rule and the steps are all above, so it's fine if the links don't open." data-gate="prompt" data-astro-cid-axuhkfem><svg width="1em" height="1em" viewBox="0 0 256 256" data-astro-cid-axuhkfem="true" data-icon="ph:copy-simple-bold"><path fill="currentColor" d="M180 64H40a12 12 0 0 0-12 12v140a12 12 0 0 0 12 12h140a12 12 0 0 0 12-12V76a12 12 0 0 0-12-12m-12 140H52V88h116Zm60-164v140a12 12 0 0 1-24 0V52H76a12 12 0 0 1 0-24h140a12 12 0 0 1 12 12"/></svg>Copy prompt</button><button class="btn icon t-press" type="button" data-copy-link="/en/i/input-16px-line" aria-label="Copy link" title="Copy link" data-astro-cid-axuhkfem><svg width="1em" height="1em" viewBox="0 0 256 256" data-astro-cid-axuhkfem="true" data-icon="ph:link-simple-bold"><path fill="currentColor" d="m87.5 151.52l64-64a12 12 0 0 1 17 17l-64 64a12 12 0 0 1-17-17m131-114a60.08 60.08 0 0 0-84.87 0l-30.12 30.09a12 12 0 0 0 17 17l30.07-30.06a36 36 0 0 1 50.93 50.92l-30.11 30.05a12 12 0 1 0 17 17l30.08-30.06a60.09 60.09 0 0 0-.03-84.91ZM135.52 171.4l-30.07 30.08a36 36 0 0 1-50.92-50.93l30.06-30.07a12 12 0 0 0-17-17l-30.04 30.1a60 60 0 0 0 84.88 84.87l30.06-30.07a12 12 0 0 0-17-17Z"/></svg></button></div><dl class="meta" data-astro-cid-axuhkfem><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>Style</dt><dd data-astro-cid-axuhkfem>Minimal, Technical</dd></div><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>Tone</dt><dd data-astro-cid-axuhkfem>Light</dd></div></dl></div><section class="notes" data-astro-cid-axuhkfem><h3 data-astro-cid-axuhkfem>Design notes</h3><div data-astro-cid-axuhkfem><p>Set input text below 16px and an iPhone pulls the whole page in when you tap the field. The rule is written down in plenty of docs; Adheeb’s answer is not to explain it but to stand two phones side by side and let you watch it happen.</p>
<p>Everything but the size is the same on both: the same “Welcome back” login page, the same blue “Log in” button, the same <a href="mailto:sam.carter@mail.com">sam.carter@mail.com</a>. The moment the email field is tapped, the 14px phone on the left pushes the page up, the heading and the icon slide off screen, and all that is left is a magnified input. The 16px phone on the right does not move.</p>
<p>One zoom hardly looks like a problem, but a login page has an email field and a password field, and every tap pulls it in again. In the end this is not a question of which size looks better — it is about not making people find their place in the form over and over.</p>
</div></section></div></div><div data-part="stage"><div class="slides" data-astro-cid-axuhkfem><figure class="slide" data-slide="0" style="--r:1.3333333333333333;--mw:720px;--mwt:720px" data-astro-cid-axuhkfem><video class="m" src="/x/adheebhameed-962869-hd.mp4" poster="/x/adheebhameed-962869.webp" width="720" height="540" muted loop playsinline autoplay preload="auto" data-astro-cid-kg7vladn></video></figure></div></div></template></body></html>
