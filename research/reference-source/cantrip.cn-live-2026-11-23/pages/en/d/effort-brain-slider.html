utton class="btn t-press" type="button" data-copy-code="/code/effort-brain-slider" data-gate="code" data-astro-cid-axuhkfem><svg width="1em" height="1em" viewBox="0 0 256 256" data-astro-cid-axuhkfem="true" data-icon="ph:code-bold"><path fill="currentColor" d="M71.68 97.22L34.74 128l36.94 30.78a12 12 0 1 1-15.36 18.44l-48-40a12 12 0 0 1 0-18.44l48-40a12 12 0 0 1 15.36 18.44m176 21.56l-48-40a12 12 0 1 0-15.36 18.44L221.26 128l-36.94 30.78a12 12 0 1 0 15.36 18.44l48-40a12 12 0 0 0 0-18.44M164.1 28.72a12 12 0 0 0-15.38 7.18l-64 176a12 12 0 0 0 7.18 15.37a11.8 11.8 0 0 0 4.1.73a12 12 0 0 0 11.28-7.9l64-176a12 12 0 0 0-7.18-15.38"/></svg>Copy code</button><a class="btn t-press" href="/code/effort-brain-slider" download="effort-brain-slider.html" data-gate="code" data-astro-cid-axuhkfem><svg width="1em" height="1em" viewBox="0 0 256 256" data-astro-cid-axuhkfem="true" data-icon="ph:download-simple-bold"><path fill="currentColor" d="M228 144v64a12 12 0 0 1-12 12H40a12 12 0 0 1-12-12v-64a12 12 0 0 1 24 0v52h152v-52a12 12 0 0 1 24 0m-108.49 8.49a12 12 0 0 0 17 0l40-40a12 12 0 0 0-17-17L140 115V32a12 12 0 0 0-24 0v83L96.49 95.51a12 12 0 0 0-17 17Z"/></svg>Download HTML</a></div></div><dl class="meta" data-astro-cid-axuhkfem><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>Style</dt><dd data-astro-cid-axuhkfem>Minimal, Playful</dd></div><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>Tone</dt><dd data-astro-cid-axuhkfem>Dark</dd></div><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>Built with</dt><dd data-astro-cid-axuhkfem>JavaScript, CSS, SVG, Canvas</dd></div></dl></div><section class="notes" data-astro-cid-axuhkfem><h3 data-astro-cid-axuhkfem>Design notes</h3><div data-astro-cid-axuhkfem><ul>
<li>The brain icon is the slider itself, so what Effort means needs no extra explanation. Low through Max stay the same pink, and the track filling up step by step makes the change in effort predictable.</li>
<li>The recommended notch gets a short vertical tick and the others a small dot: you can see where the default is without mistaking it for a place you have to stop.</li>
<li>Galaxy changes the title color, the brain’s size and the track’s material together. Purple pixels and stars spreading outward make the last notch a clear visual reward.</li>
<li>Dragging snaps to the nearest notch; clicking the track and the arrow keys also pick one. When a visitor takes over, it keeps the level they were just on instead of jumping back to the start.</li>
</ul>
</div></section></div></div><div data-part="stage"><div class="slides" data-astro-cid-axuhkfem><figure class="slide" data-slide="0" style="--r:1.833810888252149;--mw:1088px;--mwt:800px" data-theme="dark" data-astro-cid-axuhkfem><div class="m m-demo" data-demo="effort-brain-slider" data-demo-live data-theme="dark" style="background:#101010" data-astro-cid-kg7vladn><img class="m-poster" src="/posters/effort-brain-slider.webp" width="640" height="349" alt="" loading="eager" decoding="async" draggable="false" data-poster data-astro-cid-kg7vladn></div></figure></div><div class="stage-chrome" data-stage-chrome aria-hidden="true" data-astro-cid-axuhkfem></div></div></template></body></html>
