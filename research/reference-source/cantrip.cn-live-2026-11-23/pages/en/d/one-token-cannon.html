d one now and then. The feeling of watching tokens burn turns into something you can hold.</p>
<p>What comes out is not a sprite. The tickets bend in the air, turn over, and fall at different speeds, so a screen full of them never looks tidy. Each one has a stub and a perforated edge: a cinema ticket, not a banknote.</p>
<p>The cannon is not scenery either. Move in close and a row of controls surfaces below it: theme, finish (cream / shiny / gold / smoky), colour, stickers, ink. Click to stick a sticker on, drag to turn it, scroll to rotate, hold Shift and scroll to resize, backspace to remove, Esc to step back — and the panel itself hides with H. A thing made purely for fun, with a full set of knobs behind it.</p>
