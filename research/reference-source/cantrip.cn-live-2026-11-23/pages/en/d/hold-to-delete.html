s="btn t-press" type="button" data-copy-code="/code/hold-to-delete" data-gate="code" data-astro-cid-axuhkfem><svg width="1em" height="1em" viewBox="0 0 256 256" data-astro-cid-axuhkfem="true" data-icon="ph:code-bold"><path fill="currentColor" d="M71.68 97.22L34.74 128l36.94 30.78a12 12 0 1 1-15.36 18.44l-48-40a12 12 0 0 1 0-18.44l48-40a12 12 0 0 1 15.36 18.44m176 21.56l-48-40a12 12 0 1 0-15.36 18.44L221.26 128l-36.94 30.78a12 12 0 1 0 15.36 18.44l48-40a12 12 0 0 0 0-18.44M164.1 28.72a12 12 0 0 0-15.38 7.18l-64 176a12 12 0 0 0 7.18 15.37a11.8 11.8 0 0 0 4.1.73a12 12 0 0 0 11.28-7.9l64-176a12 12 0 0 0-7.18-15.38"/></svg>Copy code</button><a class="btn t-press" href="/code/hold-to-delete" download="hold-to-delete.html" data-gate="code" data-astro-cid-axuhkfem><svg width="1em" height="1em" viewBox="0 0 256 256" data-astro-cid-axuhkfem="true" data-icon="ph:download-simple-bold"><path fill="currentColor" d="M228 144v64a12 12 0 0 1-12 12H40a12 12 0 0 1-12-12v-64a12 12 0 0 1 24 0v52h152v-52a12 12 0 0 1 24 0m-108.49 8.49a12 12 0 0 0 17 0l40-40a12 12 0 0 0-17-17L140 115V32a12 12 0 0 0-24 0v83L96.49 95.51a12 12 0 0 0-17 17Z"/></svg>Download HTML</a></div></div><dl class="meta" data-astro-cid-axuhkfem><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>Style</dt><dd data-astro-cid-axuhkfem>Minimal</dd></div><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>Tone</dt><dd data-astro-cid-axuhkfem>Light</dd></div><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>Built with</dt><dd data-astro-cid-axuhkfem>CSS, JavaScript, Motion</dd></div></dl></div><section class="notes" data-astro-cid-axuhkfem><h3 data-astro-cid-axuhkfem>Design notes</h3><div data-astro-cid-axuhkfem><ul>
<li>Slow while you hesitate, fast when the system answers: holding fills the bar linearly over <code>1.6s</code>, and releasing eases back in <code>200ms</code>. A linear fill is predictable, so you can judge how much is left.</li>
<li>The red layer is a white-text copy of the same label, revealed with <code>clip-path</code>. The two layers line up exactly, so the text color is “wiped” across pixel by pixel. No color interpolation can do that so cleanly.</li>
<li>The file card above fades and shrinks on the same clock and springs back the instant you let go, so what’s being deleted is plain to see. The moment the bar fills, the button bounces back to full size with a little overshoot, so you know it’s done before your finger lifts.</li>
<li>When it completes, the button turns dark with a checkmark and narrows, the file card becomes a dashed placeholder, and a moment later everything resets in place.</li>
</ul>
</div></section></div></div><div data-part="stage"><div class="slides" data-astro-cid-axuhkfem><figure class="slide" data-slide="0" style="--r:1.3333333333333333;--mw:680px;--mwt:500px" data-theme="light" data-astro-cid-axuhkfem><div class="m m-demo" data-demo="hold-to-delete" data-demo-live data-theme="light" style="background:#f5f5f4" data-astro-cid-kg7vladn><img class="m-poster" src="/posters/hold-to-delete.webp" width="400" height="300" alt="" loading="eager" decoding="async" draggable="false" data-poster data-astro-cid-kg7vladn></div></figure></div><div class="stage-chrome" data-stage-chrome aria-hidden="true" data-astro-cid-axuhkfem></div></div></template></body></html>
