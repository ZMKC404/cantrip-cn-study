re to confirm it.</p>
<p>So the names do not stay on screen. The screen holds only the eight faces, and a name tag appears beside one face at a time, so even with many options nothing turns into a crowd of small text.</p>
<p>The faces’ features slide to one side, as if they were turning to look around. That little bit of movement makes them seem alive, and picking a mood stops being a form and becomes choosing a toy, which is what rishi means by an app that feels like playing with a toy.</p>
