simple-bold"><path fill="currentColor" d="m87.5 151.52l64-64a12 12 0 0 1 17 17l-64 64a12 12 0 0 1-17-17m131-114a60.08 60.08 0 0 0-84.87 0l-30.12 30.09a12 12 0 0 0 17 17l30.07-30.06a36 36 0 0 1 50.93 50.92l-30.11 30.05a12 12 0 1 0 17 17l30.08-30.06a60.09 60.09 0 0 0-.03-84.91ZM135.52 171.4l-30.07 30.08a36 36 0 0 1-50.92-50.93l30.06-30.07a12 12 0 0 0-17-17l-30.04 30.1a60 60 0 0 0 84.88 84.87l30.06-30.07a12 12 0 0 0-17-17Z"/></svg></button></div><dl class="meta" data-astro-cid-axuhkfem><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>Style</dt><dd data-astro-cid-axuhkfem>Minimal, Technical</dd></div><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>Tone</dt><dd data-astro-cid-axuhkfem>Light</dd></div></dl></div><section class="notes" data-astro-cid-axuhkfem><h3 data-astro-cid-axuhkfem>Design notes</h3><div data-astro-cid-axuhkfem><p>Most people have one width they like for a sidebar, yet every time they drag it back they land a few pixels off. Harsh lets the sidebar learn: each let-go is saved as a mark, and since marks never land on exactly the same pixel, each adds a small hill; marks close together stack into a bigger hill, and the tallest is your usual width. The snap point only appears once about three drags agree; one stray drag does not count.</p>
<p>Habits change, so newer marks weigh more: every five drags an old mark’s weight halves, and a new habit takes over within a few drags. Age is counted in drags, not days, so a week without touching the sidebar does not make it forget. Once set, the snap point does not shift a pixel with every drag; it moves only when the tallest hill leaves the snap zone.</p>
<p>The old trouble with snapping is that the widths right next to the snap point become unreachable. Harsh’s answer: rest in the snap zone for 0.3 seconds and the snap lets go, the edge following the cursor again without a jump; arrow-key resizing never snaps. Both drag a sidebar’s edge, but where the <a href="/en/i/bending-resize-handle">Bending Resize Handle</a> gives it a feel, this one gives it a memory. The curve above the window is those hills, and on Harsh’s page you can drag it yourself; the page ends with the full code, built on react-resizable-panels.</p>
