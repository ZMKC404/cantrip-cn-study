fill="currentColor" d="m87.5 151.52l64-64a12 12 0 0 1 17 17l-64 64a12 12 0 0 1-17-17m131-114a60.08 60.08 0 0 0-84.87 0l-30.12 30.09a12 12 0 0 0 17 17l30.07-30.06a36 36 0 0 1 50.93 50.92l-30.11 30.05a12 12 0 1 0 17 17l30.08-30.06a60.09 60.09 0 0 0-.03-84.91ZM135.52 171.4l-30.07 30.08a36 36 0 0 1-50.92-50.93l30.06-30.07a12 12 0 0 0-17-17l-30.04 30.1a60 60 0 0 0 84.88 84.87l30.06-30.07a12 12 0 0 0-17-17Z"/></svg></button></div><dl class="meta" data-astro-cid-axuhkfem><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>Style</dt><dd data-astro-cid-axuhkfem>Minimal, Soft</dd></div><div data-astro-cid-axuhkfem><dt data-astro-cid-axuhkfem>Tone</dt><dd data-astro-cid-axuhkfem>Light</dd></div></dl></div><section class="notes" data-astro-cid-axuhkfem><h3 data-astro-cid-axuhkfem>Design notes</h3><div data-astro-cid-axuhkfem><p>The usage map doesn’t use squares. It uses rounded stones of different sizes, one stone for each kind of file. The biggest is “Projects and code”, so you can see at a glance where the space went. “Free” is drawn as rings of contour lines, which sets it apart from the stones.</p>
<p>The left side lists only what can be cleaned, each row with its size. Tick items and the big figure at the top works out how much space you’ll have after cleaning. At the bottom there are two ways forward: hand it to an agent to clean, or clean directly.</p>
<p>Scanning and cleaning are done by fixed rules working together with a coding agent. The interface draws the usage, and one click cleans it up.</p>
