<li>The five storage categories share one liquid surface, and the color boundaries tilt with the water, so the bar reads as a single connected whole.</li>
<li>While dragging, the card scales up to <code>1.028</code>: the first cue that it’s been picked up. When the direction changes, the waves still carry inertia, so you can feel the weight of the motion.</li>
<li>After release the card returns to its place and the surface keeps settling. Position and water are computed separately, so the ripples still look natural once the card has stopped.</li>
<li>The capsule clip is fixed inside a <code>372×53px</code> container and the surface only changes the inner outline. The legend at the bottom stays where it is, so the colors can still be told apart while everything sloshes.</li>
</ul>
