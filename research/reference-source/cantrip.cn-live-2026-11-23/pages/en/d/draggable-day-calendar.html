sult is in front of you before you let go.

the length and the block spells out its start, end and total (“3h 45m”), so there is nothing to work out.</p>
<p>Running into another event is not left until you let go either: the one underneath narrows on the spot and the two share the width side by side, so you see what the calendar will look like while you are still dragging. It is the same idea as the <a href="/en/i/drag-reorder">Lifted List Reorder</a>: show the result before the drop, and people drag without worrying.</p>
