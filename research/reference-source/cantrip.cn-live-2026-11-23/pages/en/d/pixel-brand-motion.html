<p>Soft gradient light alternates with coarse, grainy shapes. The letters are broken apart and join the motion too, so type, icons and color blocks all share one rhythm across the film.</p>
<p>This is the brand film for the video framework fframes. At the end, the scattered letters land as the fframes wordmark.</p>
