<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><link rel="stylesheet" href="/_astro/feed.i3oLm75g.css"><link rel="stylesheet" href="/_astro/DetailBody.CIetCpo6.css"></head><body><template data-detail-tpl="interruptible-sheet" data-at="18"><div data-part="info"><div class="info" data-astro-cid-axuhkfem><div class="lead" data-astro-cid-axuhkfem><p class="labels" data-astro-cid-axuhkfem><a href="/en?c=principle" data-filter="c:principle" data-astro-cid-axuhkfem>Design Principles</a><a href="/en?t=click" data-filter="t:click" data-astro-cid-axuhkfem>Click</a></p><h2 id="detail-title" data-astro-cid-axuhkfem>Catch the Second Tap</h2><p class="desc" data-astro-cid-axuhkfem>Open a sheet, change your mind, tap again, and it should fold back. Juliette puts three handlings side by side; the one that keeps momentum reads as one motion.</p><p class="byline" data-astro-cid-axuhkfem><a href="https://x.com/shedsgns/status/2112770856396931506" target="_blank" rel="noreferrer" data-astro-cid-axuhkfem>By Juliette<svg width="1em" height="1em" viewBox="0 0 256 256" data-astro-cid-axuhkfem="true" data-icon="ph:arrow-up-right-bold"><path fill="currentColor" d="M204 64v104a12 12 0 0 1-24 0V93L72.49 200.49a12 12 0 0 1-17-17L163 76H88a12 12 0 0 1 0-24h104a12 12 0 0 1 12 12"/></svg></a><span class="sep" aria-hidden="true" data-astro-cid-axuhkfem>·</span><time datetime="2026-11-06" data-astro-cid-axuhkfem>Nov 6, 2026</time></p></div><div class="side" data-astro-cid-axuhkfem><div class="actions single" data-astro-cid-axuhkfem><button class="btn primary t-press" type="button" data-copy-prompt="Help me apply &quot;Catch the Second Tap&quot;, a rule for building interfaces, to my project.

The rule: while a sheet, drawer or popover is animating, people may change their mind and tap again. Don't ignore that tap, and don't restart from the current position at zero speed either: carry the current velocity, slow down, then reverse, so it reads as one continuous movement.
Where to look: anything that opens on one tap and closes on the next: bottom sheets, side drawers, accordions, dropdowns; especially ones that lock input while animating (an isAnimating flag and the like) or use fixed-duration CSS transitions or keyframes.
What to change: remove the lock during animation; drive position with a spring (Motion, React Spring or a hand-rolled spring) that starts each new target from the current position and velocity. A CSS transition reversed midway does start from the current value but drops the velocity; for a continuous movement, use a spring.
Don't: wait for the animation to finish before responding, or let the sheet jump to some position when it reverses.
How to check: tap again when it's halfway open; it should slow down along its way, then turn back, with no pause and no jump.

First find every place in my code it applies to, and list what you would change and how. Wait for my go-ahead before editing; when you're done, tell me how to check it.

Source: Juliette's explainer, https://x.com/shedsgns/status/2112770856396931506
See it here: https://cantrip.cn/en/i/interruptible-sheet

<p>Under each phone, a blue curve rises and falls with the sheet’s motion. The third one eases off along its existing momentum before turning back, so the reversal looks like one continuous motion.</p>
